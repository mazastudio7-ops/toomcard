  <header class="bar">
    <a href="/" class="logo"><img src="/assets/logo_toomcard_mark.webp" alt="" width="30" height="30">TOOMCARD</a>

      <button class="auth" id="authBtn" type="button">로그인</button>
    </div>

  <main class="wrap" id="app">

    <section id="vOut" class="center" style="display:flex;flex-direction:column;gap:18px;padding-top:30px" hidden>
      <h1 data-k="out_t">내 카드를 만들고<br><span class="gold">키워 보세요</span></h1>
      <p class="sub" data-k="out_s">로그인하면 내 카드가 저장되고, 몇 번 열렸는지 볼 수 있어요.</p>
      <button class="btn" id="loginBtn" type="button" data-k="login">Google로 시작하기</button>
      <a class="btn ghost" href="/maker" data-k="try">로그인 없이 먼저 만들어 보기</a>
    </section>

    <!-- 카드 없음 -->
    <section id="vNone" class="center" style="display:flex;flex-direction:column;gap:18px;padding-top:20px" hidden>
      <h1 data-k="none_t">첫 카드를 만들어 볼까요?<br><span class="gold">30초면 돼요</span></h1>
      <p class="sub" data-k="none_s">사진 한 장과 이름만 있으면 끝. 마음에 드는 모양으로 시작하세요.</p>
      <div class="starters">
        <a href="/maker?preset=toomcard" style="background-image:url(/assets/toomcard_front_plate.jpg)"></a>
        <a href="/maker?sample=creator" style="background-image:url(/assets/sample_profile_creator.jpg)"></a>
        <a href="/maker?preset=setupod" style="background-image:url(/assets/setupod_front_plate.jpg)"></a>
      </div>
      <a class="btn" href="/maker" data-k="first">내 카드 만들기</a>
    </section>

    <!-- 내 카드 -->
    <section id="vMine" hidden style="display:flex;flex-direction:column;gap:22px">
      <div class="tabs" id="tabsRow" hidden style="justify-content:center;margin:0"></div>
      <a class="adminbar" id="adminBar" href="/admin/star" hidden><span>이젠스타 검토하러 가기</span><b id="adminCnt"></b></a>
      <div class="stage-w"><a class="pcard" id="cardLink" href="#" aria-label="open"><span class="pc-bg" id="pcBg"></span><span class="pc-tx" id="pcTx"><b id="pcName"></b><small id="pcRole"></small></span></a></div>
      <div class="who"><b id="mName"></b><span id="mRole"></span></div>
      <div class="stat">
        <div><b id="sWeek">0</b><span data-k="week">이번 주 조회</span></div>
        <div><b id="sAll">0</b><span data-k="all">전체 조회</span></div>
      </div>
      <div class="stat" id="starStat" hidden>
        <div><b id="sLikes">0</b><span data-k="likes">♥ 좋아요</span></div>
        <div><b id="sClicks">0</b><span data-k="clicks">링크 클릭</span></div>
      </div>
      <p class="note" id="starNote" hidden></p>
      <div class="leadbox" id="leadBox" hidden>
        <div class="row-h"><span data-k="leads">받은 연락처</span><span id="leadCnt" class="lcnt">0</span></div>
        <div id="leadList"></div>
      </div>
      <div class="acts">
        <button class="btn" id="shareBtn" type="button" data-k="share">링크 보내기</button>
        <a class="btn ghost" id="editBtn" href="#" data-k="edit">꾸미기</a>
        <a class="btn ghost" id="starBtn" href="/#stars" data-k="seeStar">이젠스타 보기</a>
      </div>

      <div class="todo">
        <div class="todo-h"><b data-k="todo">내 카드 키우기</b><span id="todoCount">0/5</span></div>
        <div class="prog"><i id="todoBar" style="width:0"></i></div>
        <div id="todoList"></div>
      </div>

      <div>
        <div class="row-h"><span data-k="mycards">내 카드</span></div>
        <div class="row" id="cardsRow" style="margin-top:10px"></div>
        <div class="manage" id="manage"><button type="button" id="renBtn" data-k="rn">주소 바꾸기</button><button type="button" id="delBtn" data-k="del">카드 삭제</button></div>
      </div>
    </section>

    <div class="foot">
      <a href="/dashboard-legacy" data-k="biz">기업 · 리드 관리</a>
      <a href="/admin/star" id="adminLink" hidden>이젠스타 검토</a>
      <a href="/admin/print" id="adminPrintLink" hidden>인쇄 파일</a>
      <a href="/team" id="teamLink" hidden>팀 카드 관리</a>
      <a href="/" data-k="gallery">갤러리</a>
      <a href="/terms" data-k="terms">이용약관</a>
      <a href="/privacy" data-k="privacy">개인정보처리방침</a>
    </div>
  </main>

      de: { out_t: 'Erstelle deine Karte<br><span class="gold">und lass sie wachsen</span>', out_s: 'Melde dich an, um deine Karte zu speichern und Aufrufe zu sehen.', login: 'Mit Google starten', try: 'Erst ohne Anmeldung ausprobieren', none_t: 'Bereit für deine erste Karte?<br><span class="gold">30 Sekunden</span>', none_s: 'Ein Foto und dein Name reichen. Starte mit einem Look, der dir gefällt.', first: 'Meine Karte erstellen', week: 'Aufrufe diese Woche', all: 'Aufrufe gesamt', share: 'Link senden', edit: 'Gestalten', todo: 'Karte weiterentwickeln', mycards: 'Meine Karten', biz: 'Business · Leads', gallery: 'Galerie', terms: 'Nutzungsbedingungen', privacy: 'Datenschutz', login_btn: 'Anmelden', logout_btn: 'Abmelden', copied: 'Link kopiert',
        rn: 'Adresse ändern', del: 'Karte löschen', rnPrompt: 'Neue Adresse eingeben (z. B. a/mina)\nLinks und QR-Codes mit der alten Adresse funktionieren dann nicht mehr.', rnOk: 'Adresse geändert', rnBad: 'Eine Adresse besteht aus einem Buchstaben und einem Namen (z. B. a/mina)', rnTaken: 'Diese Adresse ist schon vergeben', fail: 'Bitte gleich noch einmal versuchen', delConfirm: '"{n}" löschen?\nDas lässt sich nicht rückgängig machen und alle Links und QR-Codes dieser Adresse funktionieren nicht mehr.', delDone: 'Karte gelöscht', seeStar: 'e zen star ansehen', t1: 'Foto hinzufügen', d1: 'Ein Foto verändert die ganze Karte', t2: 'Logo gestalten', d2: 'Metall-Emblem oder eigenes Logo hochladen', t3: 'Als Hintergrund speichern', d3: 'Deine Karte auf den Sperrbildschirm', t4: 'An Freunde senden', d4: 'Beim Öffnen sehen sie „Selbst erstellen“', t5: 'In Stars zeigen', d5: 'Likes im Stars-Tab sammeln', likes: '♥ Likes', clicks: 'Link-Klicks', pending: 'In Prüfung für Stars (innerhalb eines Tages online)', rejected: 'Für Stars zurückgestellt: ', approved: 'Live in Stars ✨', add: 'Neue Karte', tabP: 'Persönlich', tabTeam: 'Team verwalten', leads: 'Erhaltene Kontakte', leadNone: 'Noch keine Kontakte. Hinterlässt jemand seine Nummer auf deiner Karte, erscheint sie hier.', noname: 'Ohne Namen' }
    };
    const lang = () => (window.i18n && window.i18n.lang) || localStorage.getItem('toomcard_lang') || 'ko';
    const T = (k) => (L[lang()] || L.ko)[k] || L.ko[k] || k;
    function applyText() {
      document.querySelectorAll('[data-k]').forEach((el) => { el.innerHTML = T(el.dataset.k); });
      $('authBtn').textContent = user ? T('logout_btn') : T('login_btn');
    }
    const $ = (id) => document.getElementById(id);
    let user = null, pods = [], main = null, allPods = [], tab = 'personal';
    const demo = /[?&]demo=1/.test(location.search);

    function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }
    const flag = (k, slug) => { try { return localStorage.getItem('tc_' + k + '_' + slug) === '1'; } catch (e) { return false; } };
    const setFlag = (k, slug) => { try { localStorage.setItem('tc_' + k + '_' + slug, '1'); } catch (e) {} };

    function show(which) { ['vOut', 'vNone', 'vMine'].forEach((id) => { $(id).hidden = id !== which; }); }

    function cardOf(p) { return (p.components_json && p.components_json.card) || {}; }
    /* 앞면 배경: front.bg 가 이미지·색이 아니면 plateCardImage(마자 플레이트 등)를 쓴다 */
    function frontBg(c) { const b = (c.front && c.front.bg) || {}; return (b.type === 'image' || b.type === 'color') ? b : (c.plateCardImage ? { type: 'image', src: c.plateCardImage } : b); }
    function isDefaultSrc(src) { return !src || /^\/assets\//.test(src); }

    function todos(p) {
      const c = cardOf(p), slug = p.slug, bg = frontBg(c);
      const hasPhoto = bg.type === 'image' && !isDefaultSrc(bg.src);
      const hasLogo = !!((c.emblem && (c.emblem.img || c.emblem.source === 'logo')) || (c.logo && /^data:/.test(c.logo.src || '')));
      return [
        { k: 1, done: hasPhoto, href: `/maker?edit=${encodeURIComponent(slug)}&tab=photo` },
        { k: 2, done: hasLogo, href: `/maker?edit=${encodeURIComponent(slug)}&tab=logo` },
        { k: 3, done: flag('wp', slug), href: `/maker?edit=${encodeURIComponent(slug)}&tab=publish` },
        { k: 4, done: flag('shared', slug), act: 'share' },
        { k: 5, done: !!(c.star && c.star.on), href: `/maker?edit=${encodeURIComponent(slug)}&tab=publish` }
      ];
    }

    function renderTodos() {
      const list = todos(main), n = list.filter((x) => x.done).length;
      $('todoCount').textContent = n + '/' + list.length; $('todoBar').style.width = Math.round(n / list.length * 100) + '%';
      $('todoList').innerHTML = list.map((x) => `<div class="item ${x.done ? 'done' : ''}" data-href="${x.href || ''}" data-act="${x.act || ''}"><span class="ck">✓</span><span class="t">${T('t' + x.k)}<small>${T('d' + x.k)}</small></span><span class="go">›</span></div>`).join('');
    }
    $('todoList').addEventListener('click', (e) => {
      const it = e.target.closest('.item'); if (!it) return;
      if (it.dataset.act === 'share') share(); else if (it.dataset.href) location.href = it.dataset.href;
    });

    async function share() {
      let url = `https://toomcard.com/${main.slug}`; const name = cardOf(main).name || '';
      // 이젠스타에 올린 카드는 전화·이메일이 따로 저장돼 있다 → 명함 링크에는 키를 붙여 전부 보이게
      const st = cardOf(main).star;
      if (!demo && st && st.on && typeof getMyShareKey === 'function') { try { const k = await getMyShareKey(main.slug); if (k) url += `?k=${k}`; } catch (e) {} }
      try {
        if (navigator.share) { await navigator.share({ title: name ? name + ' | TOOMCARD' : 'TOOMCARD', url }); setFlag('shared', main.slug); renderTodos(); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      try { await navigator.clipboard.writeText(url); toast(T('copied')); setFlag('shared', main.slug); renderTodos(); } catch (e) { prompt('Link', url); }
    }
    $('shareBtn').addEventListener('click', share);

    const coOf = (p) => cardOf(p).companySlug || '';
    function renderTabs() {
      const box = $('tabsRow'), cos = [];
      allPods.forEach((p) => { const k = coOf(p); if (k && !cos.some((x) => x.k === k)) cos.push({ k, n: cardOf(p).company || k }); });
      const hasPersonal = allPods.some((p) => !coOf(p));
      if (!cos.length) { box.hidden = true; return; }
      box.hidden = false;
      box.innerHTML = (hasPersonal ? `<button type="button" data-tab="personal" class="${tab === 'personal' ? 'on' : ''}">${T('tabP')}</button>` : `<a href="/maker">${T('tabP')} +</a>`)
        + cos.map((c) => `<button type="button" data-tab="${c.k}" class="${tab === c.k ? 'on' : ''}">${c.n}</button>`).join('')
        + (tab !== 'personal' ? `<a href="/team">${T('tabTeam')}</a>` : '');
      box.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
    }
    function setTab(t) {
      tab = t;
      pods = allPods.filter((p) => (t === 'personal' ? !coOf(p) : coOf(p) === t));
      main = pods[0]; try { localStorage.setItem('toomcard_dash_tab', t); } catch (e) {}
      renderMine(); loadViews();
    }
    function renderMine() {
      renderTabs();
      const c = cardOf(main), slug = main.slug;
      const bg = frontBg(c), plate = bg.type === 'image' && /^\/assets\/.*_front_plate/.test(bg.src || '');
      $('pcBg').style.background = '';
      if (bg.type === 'image' && bg.src) $('pcBg').style.backgroundImage = `url('${bg.src}')`;
      else if (bg.type === 'color') $('pcBg').style.background = `linear-gradient(160deg, ${bg.color || '#3b1a6e'}, #07050d)`;
      else $('pcBg').style.backgroundImage = `url('/assets/toomcard_front_plate.jpg')`;
      $('pcTx').hidden = plate || !(bg.type === 'image' || bg.type === 'color');
      $('pcName').textContent = c.name || ''; $('pcRole').textContent = c.role || '';
      $('cardLink').href = `/${slug}`;
      $('mName').textContent = c.name || T('noname');
      $('mRole').textContent = [c.role, c.company].filter(Boolean).join(' · ');
      $('editBtn').href = `/maker?edit=${encodeURIComponent(slug)}`;
      renderTodos();
      const row = $('cardsRow');
      row.innerHTML = pods.map((p) => {
        const cc = cardOf(p), bg = frontBg(cc);
        const th = bg.type === 'image' && bg.src ? `background-image:url('${bg.src}')` : (bg.type === 'color' ? `background:linear-gradient(160deg, ${bg.color || '#3b1a6e'}, #07050d)` : `background-image:url('/assets/toomcard_front_plate.jpg')`);
        const ini = (cc.name || p.slug || '?').trim().charAt(0).toUpperCase();
        return `<a class="mini${main && p.slug === main.slug ? ' sel' : ''}" href="#" data-slug="${p.slug}"><div class="th" style="${th}">${bg.type === 'color' ? ini : ''}</div><small>${(cc.name || p.slug)}</small></a>`;
      }).join('') + `<a class="mini add" href="/maker"><div class="th">+</div><small>${T('add')}</small></a>`;
      row.querySelectorAll('.mini[data-slug]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); main = pods.find((p) => p.slug === a.dataset.slug); try { localStorage.setItem('toomcard_primary_personal_slug', main.slug); } catch (er) {} renderMine(); loadViews(); }));
    }

    async function loadStar() {
      const st = cardOf(main).star, on = !!(st && st.on);
      $('starStat').hidden = !on; $('starNote').hidden = true;
      if (!on) return;
      if (demo) { $('sLikes').textContent = '12'; $('sClicks').textContent = '9'; $('starNote').textContent = T('approved'); $('starNote').hidden = false; return; }
      if (typeof getMyStarStats !== 'function') return;
      const s = await getMyStarStats(main.slug); if (!s) return;
      $('sLikes').textContent = String(s.likes || 0); $('sClicks').textContent = String(s.clicks || 0);
      const r = s.review || {};
      if (r.status === 'pending') $('starNote').textContent = T('pending');
      else if (r.status === 'rejected') $('starNote').textContent = T('rejected') + (r.reason || '');
      else if (r.status === 'approved') $('starNote').textContent = T('approved');
      $('starNote').hidden = !r.status;
    }
    async function loadLeads() {
      const box = $('leadBox'); box.hidden = true;
      if (demo || typeof getMyLeads !== 'function') return;
      let all = null; try { all = await getMyLeads(); } catch (e) {}
      if (!all) return;
      const mine = all.filter((l) => l.target_slug === main.slug);
      $('leadCnt').textContent = String(mine.length);
      const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      $('leadList').innerHTML = mine.length ? mine.slice(0, 30).map((l) => {
        const m = l.metadata || {}, d = new Date(l.created_at), ph = esc(l.phone);
        return `<div class="lead"><div><a class="lp" href="tel:${ph}">${ph}</a><small>${esc([m.memo, m.channel].filter(Boolean).join(' · '))}</small></div><span class="ld">${d.getMonth() + 1}/${d.getDate()}</span></div>`;
      }).join('') : `<p class="note" style="margin:10px 0 0">${T('leadNone')}</p>`;
      box.hidden = false;
    }
    async function loadViews() {
      loadStar(); loadLeads();
      if (demo) { $('sWeek').textContent = '37'; $('sAll').textContent = '128'; return; }
      $('sWeek').textContent = '–'; $('sAll').textContent = '–';
      try {
        const [all, hist] = await Promise.all([getAnalytics(main.slug), getAnalyticsHistory(main.slug, 7)]);
        $('sAll').textContent = String(all || 0);
        $('sWeek').textContent = String((hist || []).reduce((a, b) => a + (b.views || 0), 0));
      } catch (e) { $('sWeek').textContent = '0'; $('sAll').textContent = '0'; }
    }

    async function init() {
      applyText();
      if (demo) {
        user = { email: 'demo' };
        let card = {};
        try { card = await (await fetch('/cards/toomcard.json')).json(); } catch (e) {}
        card.name = card.name || 'Alex Rivera';
        card.star = { on: true, tag: 'biz' };
        pods = [{ slug: 'toomcard', components_json: { card } }, { slug: 'demo2', components_json: { card: { name: 'Mina', front: { bg: { type: 'color', color: '#3b1a6e' } } } } }];
        main = pods[0]; applyText(); show('vMine'); renderMine(); loadViews(); return;
      }
      if (supabaseClient && supabaseClient.auth) {
        supabaseClient.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_IN' && session && !user) { user = session.user; load(); } if (ev === 'SIGNED_OUT') { user = null; show('vOut'); applyText(); } });
      }
      user = await getCurrentUser();
      try { const tc = user && await supabaseClient.rpc('tc_company_my'); if (tc && Array.isArray(tc.data) && tc.data.length) $('teamLink').hidden = false; } catch (e) {}
      try { const r = user && await supabaseClient.rpc('tc_is_admin'); if (r && r.data === true) { $('adminLink').hidden = false; $('adminPrintLink').hidden = false; $('adminBar').hidden = false; try { const q = await adminStarQueue(); if (Array.isArray(q)) $('adminCnt').textContent = q.length ? `대기 ${q.length}건` : ''; } catch (e2) {} } } catch (e) {}   // 관리자에게만 이젠스타 검토 바로가기와 대기 수
      if (location.hash.includes('access_token')) history.replaceState({}, document.title, location.pathname);
      if (!user) { show('vOut'); applyText(); return; }
      await load();
    }
    async function load() {
      applyText();
      let list = [];
      try { await claimMyPods(); list = (await getMyPods()) || []; } catch (e) {}
      allPods = list.filter((p) => !p._isAssignedStaff && p.components_json && p.components_json.card);
      if (!allPods.length) { show('vNone'); return; }
      let t = 'personal'; try { t = localStorage.getItem('toomcard_dash_tab') || 'personal'; } catch (e) {}
      if (!allPods.some((p) => (t === 'personal' ? !coOf(p) : coOf(p) === t))) t = allPods.some((p) => !coOf(p)) ? 'personal' : coOf(allPods[0]);
      let slug = null; try { slug = localStorage.getItem('toomcard_primary_personal_slug'); } catch (e) {}
      show('vMine'); setTab(t);
      const keep = pods.find((p) => p.slug === slug); if (keep && keep !== main) { main = keep; renderMine(); loadViews(); }
    }
    $('authBtn').addEventListener('click', () => { if (user && !demo) signOutUser(); else if (!demo) signInWithGoogle(); });
    $('loginBtn').addEventListener('click', () => signInWithGoogle());
    document.addEventListener('DOMContentLoaded', () => { init(); setTimeout(applyText, 300); });
    window.addEventListener('load', () => setTimeout(applyText, 200));
    $('renBtn').addEventListener('click', async () => {
      if (demo || !main) return;
      const cur = main.slug, v = (prompt(T('rnPrompt'), cur) || '').trim().toLowerCase();
      if (!v || v === cur) return;
      try {
        const { error } = await supabaseClient.rpc('tc_rename_pod', { p_old: cur, p_new: v });
        if (error) { const m = String(error.message || ''); toast(m.includes('slug_taken') ? T('rnTaken') : m.includes('slug_namespace') ? T('rnBad') : T('fail')); return; }
        try { if (localStorage.getItem('toomcard_primary_personal_slug') === cur) localStorage.setItem('toomcard_primary_personal_slug', v); } catch (e) {}
        toast(T('rnOk')); setTimeout(() => location.reload(), 900);
      } catch (e) { toast(T('fail')); }
    });
    $('delBtn').addEventListener('click', async () => {
      if (demo || !main) return;
      const name = cardOf(main).name || main.slug;
      if (!confirm(T('delConfirm').replace('{n}', name))) return;
      const ok = typeof deleteMyPod === 'function' && await deleteMyPod(main.slug);
      if (!ok) { toast(T('fail')); return; }
      try { if (localStorage.getItem('toomcard_primary_personal_slug') === main.slug) localStorage.removeItem('toomcard_primary_personal_slug'); } catch (e) {}
      toast(T('delDone')); setTimeout(() => location.reload(), 900);
    });
  </script>
  <script src="/js/site-menu.js"></script>
