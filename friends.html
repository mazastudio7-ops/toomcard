<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>툼 프렌즈 — 툼돌이 · 툼냥이 · 툼깡이 | TOOMCARD</title>
  <meta name="description" content="툼카드의 캐릭터 친구들. 툼돌이(곰), 툼냥이(고양이), 툼깡이(토끼) 32가지 모습을 내 명함·미니홈에 바로 써요.">
  <meta property="og:title" content="툼 프렌즈 — 툼돌이 · 툼냥이 · 툼깡이">
  <meta property="og:description" content="툼카드의 캐릭터 친구들을 내 명함에 바로 써요.">
  <meta property="og:image" content="https://toomcard.com/assets/plate_bear.jpg">
  <link rel="icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0b10; --line: rgba(255,255,255,.1); --mut: rgba(255,255,255,.55); --gold: #ffd978; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: #fff; font-family: 'Noto Sans KR', sans-serif; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; max-width: 1100px; margin: 0 auto; }
    .top a.logo { color: #fff; text-decoration: none; font: 900 15px Montserrat, sans-serif; letter-spacing: .08em; }
    .top a.mk { padding: 9px 16px; border-radius: 99px; background: var(--gold); color: #1a1205; font-weight: 900; text-decoration: none; font-size: 13.5px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 10px 16px 80px; }
    .hero { text-align: center; padding: 24px 0 10px; }
    .hero h1 { margin: 0; font-size: 30px; font-weight: 900; }
    .hero p { color: var(--mut); margin: 8px auto 0; max-width: 520px; line-height: 1.6; font-size: 14.5px; }
    .fam { margin-top: 34px; }
    .fam-h { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .fam-h .av { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: linear-gradient(160deg, var(--c1), var(--c2)); }
    .fam-h .av img { width: 52px; height: 52px; object-fit: contain; }
    .fam-h b { font-size: 22px; display: block; } .fam-h small { color: var(--mut); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
    .st { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 8px 10px; border-radius: 16px; background: linear-gradient(160deg, var(--c1), var(--c2)); border: 1px solid var(--line); text-decoration: none; color: #1f1a14; transition: transform .15s; }
    .st:hover { transform: translateY(-3px); }
    .st img { width: 84px; height: 84px; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); }
    .st b { font-size: 12.5px; font-weight: 800; text-align: center; } .st small { font-size: 10.5px; opacity: .65; }
    .how { margin-top: 40px; padding: 18px; border-radius: 18px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
    .how b { display: block; margin-bottom: 6px; } .how p { margin: 0; color: var(--mut); font-size: 14px; line-height: 1.7; }
    .lang { display: flex; gap: 4px; } .lang button { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--mut); border-radius: 99px; padding: 5px 10px; font-size: 12px; font-weight: 800; cursor: pointer; } .lang button[aria-pressed="true"] { background: var(--gold); color: #1a1205; border-color: var(--gold); }
  </style>
</head>
<body>
  <div class="top"><a class="logo" href="/">TOOMCARD</a><div style="display:flex;gap:10px;align-items:center"><div class="lang" id="lang"><button type="button" data-l="ko" aria-pressed="true">한국어</button><button type="button" data-l="en">EN</button><button type="button" data-l="de">DE</button></div><a class="mk" href="/maker" id="mk">🐻 내 명함에 쓰기</a></div></div>
  <div class="wrap">
    <div class="hero"><h1 id="h1">🐻🐱🐰 툼 프렌즈</h1><p id="h1p">툼카드의 캐릭터 친구들이에요. 마음에 드는 모습을 누르면 그 친구가 그려진 명함을 바로 만들 수 있어요. 미니홈·멀티링크에도 쓸 수 있어요.</p></div>
    <div id="fams"></div>
    <div class="how"><b id="howT">쓰는 방법</b><p id="howP">친구를 누르면 메이커가 열려요. 배경 색과 크기를 바꾸고, 이름만 넣으면 끝. 전부 무료예요.</p></div>
  </div>
  <script>
    const T = {
      ko: { h1: '🐻🐱🐰 툼 프렌즈', p: '툼카드의 캐릭터 친구들이에요. 마음에 드는 모습을 누르면 그 친구가 그려진 명함을 바로 만들 수 있어요. 미니홈·멀티링크에도 쓸 수 있어요.', mk: '🐻 내 명함에 쓰기', howT: '쓰는 방법', howP: '친구를 누르면 메이커가 열려요. 배경 색과 크기를 바꾸고, 이름만 넣으면 끝. 전부 무료예요.', n: '{n}가지 모습' },
      en: { h1: '🐻🐱🐰 TOOM Friends', p: 'The TOOMCARD characters. Tap a pose to make a card with that friend on it. They work on mini sites and multilinks too.', mk: '🐻 Use on my card', howT: 'How it works', howP: 'Tap a friend and the maker opens. Pick a background color and size, add your name, done. All free.', n: '{n} poses' },
      de: { h1: '🐻🐱🐰 TOOM Friends', p: 'Die TOOMCARD-Charaktere. Tippe auf eine Pose und erstelle eine Karte mit diesem Freund. Auch für Mini-Seite und Multilink.', mk: '🐻 Auf meiner Karte nutzen', howT: 'So geht’s', howP: 'Tippe auf einen Freund, der Maker öffnet sich. Hintergrundfarbe und Größe wählen, Namen eintragen, fertig. Alles kostenlos.', n: '{n} Posen' }
    };
    const COLORS = { bear: ['#fff3e4', '#f7c9a8'], cat: ['#e3f6ef', '#a8dcc8'], bunny: ['#ffe4ec', '#f7b6c8'] };
    let lang = (navigator.language || 'ko').slice(0, 2); if (!T[lang]) lang = 'ko';
    let M = null;
    function paint() {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.getElementById('h1').textContent = t.h1; document.getElementById('h1p').textContent = t.p; document.getElementById('mk').textContent = t.mk;
      document.getElementById('howT').textContent = t.howT; document.getElementById('howP').textContent = t.howP;
      document.querySelectorAll('#lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
      if (!M) return;
      document.getElementById('fams').innerHTML = Object.entries(M.families).map(([fam, f]) => {
        const list = M.stickers.filter((s) => s.family === fam), c = COLORS[fam] || COLORS.bear;
        return `<section class="fam" style="--c1:${c[0]};--c2:${c[1]}"><div class="fam-h"><div class="av"><img src="/assets/stickers/${list[0].id}.png" alt=""></div><div><b>${f.emoji} ${f[lang]}</b><small>${t.n.replace('{n}', list.length)}</small></div></div>
          <div class="grid">${list.map((s) => `<a class="st" href="/maker?friend=${s.id}"><img src="/assets/stickers/${s.id}.png" alt="${s[lang]}" loading="lazy"><b>${s[lang]}</b><small>${s.id}</small></a>`).join('')}</div></section>`;
      }).join('');
    }
    document.getElementById('lang').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { lang = b.dataset.l; paint(); } });
    fetch('/assets/stickers/manifest.json').then((r) => r.json()).then((m) => { M = m; paint(); });
    paint();
  </script>
</body>
</html>
