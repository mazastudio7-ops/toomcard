<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TOOMCARD Studio | 3D 디지털 명함 만들기</title>
  <meta name="description" content="앞면은 내 배경화면처럼, 뒷면은 내 정보. 30초면 완성되는 3D 디지털 명함.">
  <meta property="og:title" content="TOOMCARD Studio">
  <meta property="og:image" content="https://toomcard.com/assets/toomcard_og_banner.jpg">
  <link rel="icon" href="/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <script src="https://unpkg.com/lucide@0.344.0"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/card-core.js"></script>
  <script src="/js/i18n.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; max-width: 100%; }
    body {
      font-family: var(--tc-font-body);
      background: var(--tc-bg);
      color: var(--tc-text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* ── 헤더 ─────────────────────────────────────── */
    .studio-header {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 20px;
      background: rgba(7, 5, 13, 0.85); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--tc-border);
    }
    .brand { display: flex; align-items: center; gap: 10px; font: 900 16px var(--tc-font-display); letter-spacing: 0.5px; }
    .brand img { width: 30px; height: 30px; border-radius: 8px; object-fit: cover; }
    .brand .accent { color: var(--tc-accent); }
    .brand .badge { font: 800 9.5px var(--tc-font-body); letter-spacing: 0.2em; padding: 3px 7px; border-radius: 5px; background: var(--tc-accent); color: #000; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .link-quiet { font-size: 12.5px; font-weight: 700; color: var(--tc-text-muted); padding: 7px 12px; border-radius: 99px; border: 1px solid var(--tc-border); }
    .link-quiet:hover { color: var(--tc-text); border-color: var(--tc-border-strong); }

    /* ── 3열 작업 공간 ───────────────────────────── */
    .studio {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr) 300px;
      min-height: calc(100vh - 53px);
    }
    .panel {
      padding: 20px 18px 40px;
      overflow-y: auto;
      max-height: calc(100vh - 53px);
      display: flex; flex-direction: column; gap: 22px;
    }
    .panel-left { border-right: 1px solid var(--tc-border); }
    .panel-right { border-left: 1px solid var(--tc-border); }

    .section { display: flex; flex-direction: column; gap: 10px; }
    .section-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: var(--tc-text); }
    .section-title i { width: 15px; height: 15px; color: var(--tc-accent); }
    .section-hint { font-size: 11.5px; color: var(--tc-text-subtle); margin-top: -4px; }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11.5px; font-weight: 700; color: var(--tc-text-muted); }
    .field label .req { color: var(--tc-accent); margin-left: 4px; font-weight: 600; }
    .input, .select {
      width: 100%; height: 38px; padding: 0 11px;
      border-radius: var(--tc-radius-sm);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--tc-border);
      color: var(--tc-text); font: 600 13px var(--tc-font-body);
      outline: none; transition: border-color 0.15s;
    }
    .input:focus, .select:focus { border-color: var(--tc-accent-border); background: rgba(255, 255, 255, 0.07); }
    .input::placeholder { color: var(--tc-text-subtle); font-weight: 500; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row-social { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
    .select { appearance: none; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      appearance: none; cursor: pointer;
      padding: 7px 11px; border-radius: 99px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--tc-border);
      color: var(--tc-text-muted); font: 700 12px var(--tc-font-body);
      transition: all 0.15s;
    }
    .chip:hover { color: var(--tc-text); border-color: var(--tc-border-strong); }
    .chip[aria-pressed="true"] { background: var(--tc-accent-soft); border-color: var(--tc-accent); color: var(--tc-accent); }

    /* 배경 썸네일 */
    .bg-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .bg-thumb {
      aspect-ratio: 3 / 4; border-radius: 10px; cursor: pointer; overflow: hidden;
      border: 2px solid transparent; background-size: cover; background-position: center;
      position: relative; transition: transform 0.15s, border-color 0.15s;
    }
    .bg-thumb:hover { transform: translateY(-2px); }
    .bg-thumb[aria-pressed="true"] { border-color: var(--tc-accent); box-shadow: 0 0 0 1px var(--tc-accent), 0 6px 16px var(--tc-accent-glow); }
    .bg-thumb.upload { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1.5px dashed var(--tc-border-strong); background: rgba(255,255,255,0.03); color: var(--tc-text-muted); font: 700 10.5px var(--tc-font-body); text-align: center; }
    .bg-thumb.upload i { width: 16px; height: 16px; }
    .bg-thumb.upload:hover { border-color: var(--tc-accent); color: var(--tc-accent); }
    .bg-thumb .tag { position: absolute; left: 5px; bottom: 5px; font: 800 8.5px var(--tc-font-body); letter-spacing: 0.1em; padding: 2px 5px; border-radius: 4px; background: rgba(0,0,0,0.55); color: #fff; }

    .toggle { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--tc-text-muted); padding: 8px 0; }
    .switch { position: relative; width: 38px; height: 22px; border-radius: 99px; background: rgba(255,255,255,0.12); border: none; cursor: pointer; transition: background 0.15s; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch[aria-checked="true"] { background: var(--tc-accent); }
    .switch[aria-checked="true"]::after { transform: translateX(16px); }

    /* 무대 */
    .stage {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 30%, #150d28 0%, #06030c 100%);
    }
    .stage iframe {
      width: min(400px, 100%);
      height: min(720px, calc(100vh - 150px));
      min-height: 520px;
      border: none; border-radius: 24px; background: transparent;
    }
    .stage-tools { display: flex; gap: 8px; }
    .tool-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 99px;
      background: rgba(255, 255, 255, 0.06); border: 1px solid var(--tc-border);
      color: var(--tc-text-muted); font: 700 12px var(--tc-font-body); cursor: pointer;
    }
    .tool-btn:hover { color: var(--tc-text); border-color: var(--tc-border-strong); }
    .tool-btn i { width: 14px; height: 14px; }

    /* 발행 패널 */
    .btn-primary {
      width: 100%; height: 46px; border: none; border-radius: var(--tc-radius);
      background: var(--tc-accent); color: #000; font: 800 14px var(--tc-font-body);
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 8px 20px var(--tc-accent-glow); transition: transform 0.15s, filter 0.15s;
    }
    .btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .btn-secondary {
      width: 100%; height: 40px; border-radius: var(--tc-radius-sm);
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--tc-border);
      color: var(--tc-text); font: 700 12.5px var(--tc-font-body); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    }
    .btn-secondary:hover { border-color: var(--tc-border-strong); background: rgba(255,255,255,0.08); }
    .btn-secondary i { width: 14px; height: 14px; }
    .url-preview { display: flex; align-items: center; height: 38px; padding: 0 11px; border-radius: var(--tc-radius-sm); background: rgba(255,255,255,0.04); border: 1px solid var(--tc-border); font: 600 12.5px ui-monospace, monospace; color: var(--tc-text-muted); overflow: hidden; }
    .url-preview span { color: var(--tc-text-subtle); }
    .url-preview input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--tc-text); font: inherit; }
    .result { display: none; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--tc-radius); background: var(--tc-accent-soft); border: 1px solid var(--tc-accent-border); }
    .result.show { display: flex; }
    .result .title { font-size: 13px; font-weight: 800; color: var(--tc-accent); }
    .result .link { font: 600 12px ui-monospace, monospace; color: var(--tc-text); word-break: break-all; }
    .result #resultQr { width: 120px; height: 120px; margin: 4px auto; padding: 8px; background: #fff; border-radius: 10px; }
    .result #resultQr img, .result #resultQr canvas { width: 104px !important; height: 104px !important; }
    .divider { height: 1px; background: var(--tc-border); }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; padding: 11px 18px; border-radius: 99px; background: rgba(20,16,30,0.95); border: 1px solid var(--tc-border-strong); color: #fff; font: 700 13px var(--tc-font-body); z-index: 100; transition: all 0.25s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── 팬 캐러셀 ─────────────────────────────────── */
    .carousel { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .stage { overflow: hidden; }
    .car-track { position: relative; height: min(700px, calc(100vh - 190px)); min-height: 480px; width: 100%; display: flex; align-items: center; justify-content: center; }
    .car-track iframe { position: relative; z-index: 5; height: 100%; aspect-ratio: 0.64; width: auto; max-width: 100%; border: none; border-radius: 24px; background: transparent; }
    .car-stack { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .car-thumb {
      position: absolute; top: 50%; left: 50%;
      border-radius: 26px; background-size: cover; background-position: center;
      border: 1.5px solid rgba(255,255,255,0.2);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55);
      pointer-events: auto; cursor: pointer; will-change: transform, opacity;
    }
    .car-stack.animating .car-thumb { transition: transform 0.34s cubic-bezier(.2,.8,.2,1), opacity 0.34s; }
    .car-track iframe { transition: opacity 0.12s ease; }
    .car-nav {
      position: absolute; top: 50%; z-index: 6; transform: translateY(-50%);
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--tc-border-strong);
      background: rgba(10,8,18,0.7); color: #fff; font: 700 20px/1 var(--tc-font-body); cursor: pointer;
      display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px);
    }
    .car-nav.prev { left: 8px; } .car-nav.next { right: 8px; }
    .car-label { display: flex; align-items: center; gap: 10px; font: 800 14px var(--tc-font-display); letter-spacing: 0.04em; }
    .car-label .idx { font: 600 11.5px var(--tc-font-body); color: var(--tc-text-subtle); letter-spacing: 0; }
    .tool-btn.accent { color: #000; background: var(--tc-accent); border-color: var(--tc-accent); }

    /* 사진 조정 슬라이더 */
    .slider-row { display: grid; grid-template-columns: 44px 1fr 38px; align-items: center; gap: 10px; font-size: 12px; font-weight: 700; color: var(--tc-text-muted); }
    .slider-row output { font: 600 11px ui-monospace, monospace; color: var(--tc-text-subtle); text-align: right; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.14); outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--tc-accent); box-shadow: 0 2px 8px rgba(0,0,0,0.5); cursor: pointer; }
    input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: none; border-radius: 50%; background: var(--tc-accent); cursor: pointer; }
    .photo-off { font-size: 12px; color: var(--tc-text-subtle); }
    #photoAdjust[hidden] { display: none; }
    .filter-chips .chip { padding: 6px 10px; font-size: 11.5px; }
    .link-reset { align-self: flex-start; background: none; border: none; color: var(--tc-text-subtle); font: 700 11.5px var(--tc-font-body); cursor: pointer; text-decoration: underline; }

    .tabbar, .sheet-head { display: none; }

    /* ── 모바일: 큰 캐러셀 + 하단 탭 + 시트 ───────── */
    @media (max-width: 980px) {
      :root { --tabbar-h: 62px; --sheet-h: calc(var(--app-h, 100dvh) * 0.5); }
      body { overflow: hidden; }
      .studio-header { padding: 10px 14px; }
      .brand .badge, .link-quiet { display: none; }
      .studio { display: block; min-height: 0; }
      .stage {
        height: calc(var(--app-h, 100dvh) - 53px - var(--tabbar-h) - env(safe-area-inset-bottom));
        padding: 10px 0 8px; gap: 8px; transition: height 0.3s ease;
      }
      body.sheet-open .stage { height: calc(var(--app-h, 100dvh) - 53px - var(--tabbar-h) - var(--sheet-h) - env(safe-area-inset-bottom)); }
      .car-track { height: calc(100% - 78px); min-height: 0; }
      body.sheet-open .car-track { height: calc(100% - 40px); }
      body.sheet-open .car-label, body.sheet-open .car-nav { display: none; }
      .car-track iframe { max-width: 74vw; border-radius: 18px; }
      .car-nav { display: none; }
      .stage-tools .tool-btn { padding: 6px 12px; font-size: 11.5px; }

      .panel {
        position: fixed; left: 0; right: 0; z-index: 30;
        bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
        height: var(--sheet-h); max-height: none; overflow-y: auto;
        padding: 0 16px 24px; gap: 16px;
        background: #0e0b17; border: none; border-top: 1px solid var(--tc-border-strong);
        border-radius: 20px 20px 0 0; box-shadow: 0 -12px 30px rgba(0,0,0,0.5);
        transform: translateY(calc(100% + var(--tabbar-h) + 40px)); transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
      }
      body.sheet-open .panel.has-on { transform: none; }
      .panel .section, .panel .divider { display: none; }
      .panel .section.on { display: flex; }
      .desk-only { display: none !important; }
      .sheet-head {
        display: flex; align-items: center; justify-content: space-between;
        position: sticky; top: 0; z-index: 2; margin: 0 -16px; padding: 14px 16px 10px;
        background: #0e0b17; font: 800 14px var(--tc-font-body);
      }
      .sheet-head button { background: var(--tc-accent); color: #000; border: none; border-radius: 99px; padding: 7px 16px; font: 800 12.5px var(--tc-font-body); cursor: pointer; }
      .panel .section-title { display: none; }

      .tabbar {
        display: grid; grid-template-columns: repeat(5, 1fr);
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
        height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
        background: rgba(7,5,13,0.96); border-top: 1px solid var(--tc-border); backdrop-filter: blur(14px);
      }
      .tabbar button {
        appearance: none; background: none; border: none; color: var(--tc-text-subtle);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        font: 700 11px var(--tc-font-body); cursor: pointer;
      }
      .tabbar button i { width: 20px; height: 20px; }
      .tabbar button[aria-selected="true"] { color: var(--tc-accent); }
      .tabbar button.publish { color: var(--tc-accent); }
      .bg-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

  <header class="studio-header">
    <a href="/" class="brand">
      <img src="/assets/logo_toomcard_hd.gif" alt="">
      <span>TOOM<span class="accent">CARD</span></span>
      <span class="badge">STUDIO</span>
    </a>
    <div class="header-right">
      <div data-i18n-switcher></div>
      <a href="/dashboard" class="link-quiet" data-i18n="nav.dashboard">내 명함 관리</a>
    </div>
  </header>

  <main class="studio">

    <!-- ── 왼쪽: 조작 ───────────────────────────────── -->
    <aside class="panel panel-left">

      <div class="sheet-head"><span class="sheet-title"></span><button type="button" onclick="closeSheet()" data-i18n="maker.done">완료</button></div>

      <!-- 0. 시작점 (데스크톱 전용: 폰은 캐러셀이 대신한다) -->
      <section class="section desk-only" id="secStart">
        <div class="section-title"><i data-lucide="sparkles"></i><span data-i18n="maker.start_points">시작점</span></div>
        <div class="chips" id="startChips"></div>
      </section>

      <!-- 1. 기본 정보 -->
      <section class="section" id="secInfo" data-tab="info">
        <div class="section-title"><i data-lucide="user"></i><span data-i18n="maker.sec_info">1. 기본 정보</span></div>
        <div class="row-2">
          <div class="field"><label><span data-i18n="maker.name">이름</span><span class="req">*</span></label><input class="input" id="fName" placeholder="홍길동" data-i18n-placeholder="maker.name_ph"></div>
          <div class="field"><label data-i18n="maker.role">직함</label><input class="input" id="fRole" placeholder="대표" data-i18n-placeholder="maker.role_ph"></div>
        </div>
        <div class="field"><label><span data-i18n="maker.company">회사 / 브랜드</span><span class="req">*</span></label><input class="input" id="fCompany" placeholder="TOOMCARD" data-i18n-placeholder="maker.company_ph"></div>
        <div class="field"><label data-i18n="maker.slogan">슬로건 한 줄</label><input class="input" id="fSlogan" placeholder="오늘의 만남을 내일의 비즈니스로"></div>
        <div class="row-2">
          <div class="field"><label data-i18n="maker.phone">전화번호</label><input class="input" id="fPhone" type="tel" placeholder="+82 10-1234-5678"></div>
          <div class="field"><label data-i18n="maker.email">이메일</label><input class="input" id="fEmail" type="email" placeholder="me@company.com"></div>
        </div>
        <div class="field"><label data-i18n="maker.website">웹사이트</label><input class="input" id="fWebsite" type="url" placeholder="https://"></div>
        <div class="field">
          <label data-i18n="maker.social">소셜 채널 1개</label>
          <div class="row-social">
            <select class="select" id="fSocialType">
              <option value="kakao">KakaoTalk</option>
              <option value="whatsapp">WhatsApp</option>
              <option value="instagram">Instagram</option>
              <option value="linkedin">LinkedIn</option>
              <option value="threads">Threads</option>
              <option value="youtube">YouTube</option>
            </select>
            <input class="input" id="fSocialUrl" type="url" placeholder="https://">
          </div>
        </div>
        <div class="field">
          <label data-i18n="maker.tags">키워드 태그 (쉼표로 구분, 최대 3)</label>
          <input class="input" id="fTags" placeholder="브랜딩, 디자인, 컨설팅">
        </div>
      </section>

      <!-- 2. 앞면 배경 (데스크톱 전용 썸네일) -->
      <section class="section desk-only" id="secBg">
        <div class="section-title"><i data-lucide="image"></i><span data-i18n="maker.sec_bg">2. 앞면 배경</span></div>
        <p class="section-hint" data-i18n="maker.bg_hint">폰 배경화면 고르듯이. 내 사진이 제일 좋아요.</p>
        <div class="bg-grid" id="bgGrid">
          <label class="bg-thumb upload" for="bgFile"><i data-lucide="image-plus"></i><span data-i18n="maker.bg_upload">내 사진</span></label>
        </div>
      </section>

      <!-- 2-1. 사진 조정 -->
      <section class="section" id="secPhoto" data-tab="photo">
        <div class="section-title"><i data-lucide="sliders-horizontal"></i><span data-i18n="maker.sec_photo">사진 조정</span></div>
        <button type="button" class="btn-secondary" onclick="pickPhoto()"><i data-lucide="image-plus"></i><span data-i18n="maker.pick_photo">내 사진 고르기</span></button>
        <p class="photo-off" id="photoOff" data-i18n="maker.photo_only">사진 배경일 때 크기·위치·색을 바꿀 수 있어요.</p>
        <div id="photoAdjust" style="display:flex; flex-direction:column; gap:14px;" hidden>
          <p class="photo-off" data-i18n="maker.adj_gesture">카드 위에서 끌면 위치, 두 손가락으로 벌리면 크기가 바뀌어요.</p>
          <div class="slider-row"><span data-i18n="maker.adj_zoom">크기</span><input type="range" id="adjZoom" min="1" max="2.5" step="0.01" value="1"><output id="outZoom">100%</output></div>
          <div class="slider-row"><span data-i18n="maker.adj_x">좌우</span><input type="range" id="adjX" min="0" max="100" step="1" value="50"><output id="outX">50</output></div>
          <div class="slider-row"><span data-i18n="maker.adj_y">상하</span><input type="range" id="adjY" min="0" max="100" step="1" value="50"><output id="outY">50</output></div>
          <div class="slider-row"><span data-i18n="maker.adj_bright">밝기</span><input type="range" id="adjBright" min="0.6" max="1.4" step="0.01" value="1"><output id="outBright">100%</output></div>
          <div class="chips filter-chips" id="filterChips">
            <button class="chip" data-filter="none" aria-pressed="true" data-i18n="maker.f_none">원본</button>
            <button class="chip" data-filter="vivid" data-i18n="maker.f_vivid">선명</button>
            <button class="chip" data-filter="mono" data-i18n="maker.f_mono">흑백</button>
            <button class="chip" data-filter="warm" data-i18n="maker.f_warm">따뜻하게</button>
            <button class="chip" data-filter="cool" data-i18n="maker.f_cool">차갑게</button>
            <button class="chip" data-filter="film" data-i18n="maker.f_film">필름</button>
            <button class="chip" data-filter="dim" data-i18n="maker.f_dim">어둡게</button>
          </div>
          <button type="button" class="link-reset" onclick="resetAdjust()" data-i18n="maker.adj_reset">조정 초기화</button>
        </div>
        <input type="file" id="bgFile" accept="image/*" hidden>
      </section>

      <!-- 3. 글자·로고 -->
      <section class="section" id="secText" data-tab="text">
        <div class="section-title"><i data-lucide="type"></i><span data-i18n="maker.sec_text">3. 앞면 글자</span></div>
        <div class="chips" id="textChips">
          <button class="chip" data-layout="none" aria-pressed="true" data-i18n="maker.text_none">글자 없음</button>
          <button class="chip" data-layout="bottom-left" data-i18n="maker.text_bl">왼쪽 아래</button>
          <button class="chip" data-layout="bottom-center" data-i18n="maker.text_bc">가운데 아래</button>
          <button class="chip" data-layout="center" data-i18n="maker.text_c">정중앙</button>
          <button class="chip" data-layout="top-left" data-i18n="maker.text_tl">왼쪽 위</button>
        </div>
        <div class="toggle"><span data-i18n="maker.show_logo">로고 함께 표시</span><button class="switch" id="logoSwitch" role="switch" aria-checked="false"></button></div>
        <div class="field"><label data-i18n="maker.logo_upload">로고 / 프로필 사진 (선택)</label><input type="file" id="logoFile" accept="image/*" class="input" style="padding-top:8px;"></div>
      </section>

      <!-- 4. 마감 -->
      <section class="section" id="secFinish" data-tab="finish">
        <div class="section-title"><i data-lucide="gem"></i><span data-i18n="maker.sec_finish">4. 마감 &amp; 뒷면</span></div>
        <div class="chips" id="finishChips">
          <button class="chip" data-finish="metal" aria-pressed="true" data-i18n="maker.finish_metal">메탈</button>
          <button class="chip" data-finish="glass" data-i18n="maker.finish_glass">유리</button>
          <button class="chip" data-finish="matte" data-i18n="maker.finish_matte">매트</button>
        </div>
        <div class="toggle"><span data-i18n="maker.qr_subtle">앞면에 옅은 QR 깔기</span><button class="switch" id="qrSwitch" role="switch" aria-checked="true"></button></div>
        <div class="field">
          <label data-i18n="maker.back_color">뒷면 색상</label>
          <div class="chips" id="themeChips"></div>
        </div>
      </section>
    </aside>

    <!-- ── 가운데: 3D 무대 ──────────────────────────── -->
    <section class="stage">
      <div class="carousel">
        <button type="button" class="car-nav prev" onclick="goDesign(designIdx - 1, -1)" aria-label="Previous">‹</button>
        <div class="car-track" id="carTrack">
          <div class="car-stack" id="carStack"></div>
          <iframe id="preview" src="/card.html?embed=simulator&maker=1&id=toomcard" title="Live preview"></iframe>
        </div>
        <button type="button" class="car-nav next" onclick="goDesign(designIdx + 1, 1)" aria-label="Next">›</button>
      </div>
      <div class="car-label"><span id="designName">TOOMCARD</span><span class="idx" id="designIdxLabel"></span></div>
      <div class="stage-tools">
        <button class="tool-btn" onclick="flip('show_front')"><i data-lucide="image"></i><span data-i18n="maker.front">앞면</span></button>
        <button class="tool-btn" onclick="flip('show_back')"><i data-lucide="file-text"></i><span data-i18n="maker.back">뒷면</span></button>
        <button class="tool-btn accent desk-only" onclick="pickPhoto()"><i data-lucide="image-plus"></i><span data-i18n="maker.add_photo">내 사진</span></button>
      </div>
    </section>

    <!-- ── 오른쪽: 발행 ─────────────────────────────── -->
    <aside class="panel panel-right">
      <div class="sheet-head"><span class="sheet-title"></span><button type="button" onclick="closeSheet()" data-i18n="maker.done">완료</button></div>
      <section class="section" id="secPublish" data-tab="publish">
        <div class="section-title"><i data-lucide="globe"></i><span data-i18n="maker.sec_publish">발행</span></div>
        <div class="field">
          <label><span data-i18n="maker.slug">명함 주소</span> <span style="font-weight:600;opacity:.6;" data-i18n="maker.slug_hint">비워두면 자동 생성</span></label>
          <div class="url-preview"><span>toomcard.com/</span><input id="fSlug" placeholder="alex" data-i18n-placeholder="maker.slug_ph"></div>
        </div>
        <button class="btn-primary" id="btnPublish" onclick="publish()"><i data-lucide="rocket" style="width:16px;height:16px;"></i><span data-i18n="maker.publish">명함 만들기</span></button>
        <div class="result" id="result">
          <div class="title" data-i18n="maker.published_title">3D 명함이 발행되었습니다!</div>
          <a class="link" id="resultLink" target="_blank"></a>
          <div id="resultQr"></div>
          <button class="btn-secondary" onclick="copyLink()"><i data-lucide="copy"></i><span data-i18n="common.copy_link">링크 복사</span></button>
          <button class="btn-secondary" onclick="shareLink()"><i data-lucide="share-2"></i><span data-i18n="common.share_other">다른 앱 공유</span></button>
        </div>
      </section>

      <div class="divider"></div>

      <section class="section" id="secExport" data-tab="publish">
        <div class="section-title"><i data-lucide="smartphone"></i><span data-i18n="maker.sec_export">내보내기</span></div>
        <button class="btn-secondary" onclick="saveWallpaper()"><i data-lucide="download"></i><span data-i18n="maker.wallpaper">앞면을 폰 배경화면으로 저장</span></button>
        <a class="btn-secondary" href="/#nfc"><i data-lucide="credit-card"></i><span data-i18n="maker.nfc_order">실물 NFC 카드 주문</span></a>
        <button class="btn-secondary" onclick="exportJson()"><i data-lucide="file-code-2"></i><span data-i18n="maker.backup_json">JSON 백업</span></button>
      </section>
    </aside>
  </main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="info"><i data-lucide="user"></i><span data-i18n="maker.tab_info">정보</span></button>
    <button type="button" data-tab="photo"><i data-lucide="sliders-horizontal"></i><span data-i18n="maker.tab_photo">사진</span></button>
    <button type="button" data-tab="text"><i data-lucide="type"></i><span data-i18n="maker.tab_text">글자</span></button>
    <button type="button" data-tab="finish"><i data-lucide="gem"></i><span data-i18n="maker.tab_finish">마감</span></button>
    <button type="button" data-tab="publish" class="publish"><i data-lucide="rocket"></i><span data-i18n="maker.tab_publish">발행</span></button>
  </nav>

  <div class="toast" id="toast"></div>

  <script src="/js/auth-modal.js"></script>
  <script>
    /* ──────────────────────────────────────────────────────────────
     * 상태: 카드 JSON 하나. 뷰어(card.html)가 그대로 그린다.
     * ────────────────────────────────────────────────────────────── */
    const DEFAULT_CARD = {
      layout: 'plate', theme: 'obsidian', edition: 'TITANIUM PRO',
      name: '', role: '', company: '', slogan: '', phone: '', email: '',
      moatTags: [],
      logo: { src: '/assets/logo_toomcard_hd.gif', alt: '' },
      primaryAction: { url: '', label: '', icon: 'globe' },
      socials: [],
      front: { bg: { type: 'image', src: '/assets/toomcard_front_plate.jpg' }, text: { layout: 'none', showLogo: false, tone: 'auto' }, finish: 'metal', qr: 'subtle' }
    };
    let card = JSON.parse(JSON.stringify(DEFAULT_CARD));
    let publishedUrl = '';

    const CURATED_BG = [
      { id: 'toomcard', type: 'image', src: '/assets/toomcard_front_plate.jpg', tag: 'METAL' },
      { id: 'toomus',   type: 'image', src: '/assets/toomus_front_plate.jpg',   tag: 'GOLD' },
      { id: 'setupod',  type: 'image', src: '/assets/setupod_front_plate.jpg',  tag: 'NEON' },
      { id: 'maza',     type: 'image', src: '/assets/maza_front_plate.jpg',     tag: 'VIOLET' },
      { id: 'g-ink',    type: 'gradient', from: '#1c1c22', to: '#050507', angle: 160 },
      { id: 'g-navy',   type: 'gradient', from: '#0e1a3d', to: '#05070f', angle: 160 },
      { id: 'g-violet', type: 'gradient', from: '#3b1a6e', to: '#0b0612', angle: 160 },
      { id: 'g-emerald',type: 'gradient', from: '#064e3b', to: '#04120d', angle: 160 },
      { id: 'g-rose',   type: 'gradient', from: '#831843', to: '#1a0810', angle: 160 },
      { id: 'g-sand',   type: 'gradient', from: '#e7ded3', to: '#b9a58c', angle: 160 },
      { id: 'g-white',  type: 'color', color: '#f4f4f6' },
    ];
    const THEMES = [
      ['obsidian', '옵시디언', '#475569'], ['navy-gold', '골드 네이비', '#ffd54f'], ['violet', '바이올렛', '#a855f7'],
      ['white-minimal', '화이트', '#ffffff'], ['emerald', '에메랄드', '#10b981'], ['frosted-acrylic', '프로스티드', '#38bdf8'],
      ['warm-sand', '웜샌드', '#d6c6b4'], ['rosegold', '로즈골드', '#ec4899']
    ];
    // 시작점: 배경 + 글자 위치 + 마감 + 뒷면 색을 한 번에
    const STARTS = {
      toomcard: { label: 'TOOMCARD', bg: 'toomcard', text: 'none', finish: 'metal', theme: 'obsidian' },
      toomus:   { label: 'TOOMUS Gold', bg: 'toomus', text: 'none', finish: 'metal', theme: 'navy-gold' },
      setupod:  { label: 'SETUPOD Neon', bg: 'setupod', text: 'none', finish: 'glass', theme: 'violet' },
      maza:     { label: 'MAZA', bg: 'maza', text: 'none', finish: 'metal', theme: 'violet' },
      obsidian: { label: 'Obsidian', bg: 'g-ink', text: 'bottom-left', finish: 'metal', theme: 'obsidian' },
      'navy-gold': { label: 'Navy Gold', bg: 'g-navy', text: 'bottom-left', finish: 'metal', theme: 'navy-gold' },
      'white-minimal': { label: 'White', bg: 'g-white', text: 'bottom-left', finish: 'matte', theme: 'white-minimal' },
      violet:   { label: 'Violet', bg: 'g-violet', text: 'center', finish: 'glass', theme: 'violet' },
      emerald:  { label: 'Emerald', bg: 'g-emerald', text: 'bottom-left', finish: 'metal', theme: 'emerald' },
      rosegold: { label: 'Rose Gold', bg: 'g-rose', text: 'bottom-center', finish: 'glass', theme: 'rosegold' },
      'warm-sand': { label: 'Warm Sand', bg: 'g-sand', text: 'bottom-left', finish: 'matte', theme: 'warm-sand' },
      'frosted-acrylic': { label: 'Frosted', bg: 'g-ink', text: 'center', finish: 'glass', theme: 'frosted-acrylic' },
    };
    const $ = (id) => document.getElementById(id);
    const t = (k) => (window.i18n ? i18n.t(k) : k);

    /* ── 렌더 ───────────────────────────────────────── */
    function slugify(v) { return (v || '').toLowerCase().replace(/[^a-z0-9가-힣_-]/g, '').slice(0, 40); }

    function collect() {
      card.name = $('fName').value.trim();
      card.role = $('fRole').value.trim();
      card.company = $('fCompany').value.trim();
      card.companyWatermark = card.company;
      card.slogan = $('fSlogan').value.trim();
      card.phone = $('fPhone').value.trim();
      card.email = $('fEmail').value.trim();
      card.title = card.role;
      card.moatTags = $('fTags').value.split(',').map((s) => s.trim()).filter(Boolean).slice(0, 3);
      const web = $('fWebsite').value.trim();
      card.primaryAction = web ? { url: web, label: t('common.website'), icon: 'globe' } : null;
      const su = $('fSocialUrl').value.trim();
      const st = $('fSocialType').value;
      card.socials = su ? [{ type: st, url: su, label: $('fSocialType').selectedOptions[0].text }] : [];
      card.logo.alt = card.company;
      card.vcard = {
        firstName: card.name, lastName: '', formattedName: card.name, org: card.company,
        title: card.role, tel: card.phone, email: card.email, url: web || ''
      };
      const slug = slugify($('fSlug').value) || slugify(card.name);
      card.slug = slug;
      card.id = slug;
      return card;
    }

    // 입력칸 placeholder에서 예시 값을 뽑는다 ("예: 홍길동" → "홍길동")
    function sample(id) { return ($(id).getAttribute('placeholder') || '').replace(/^(예:|e\.g\.|z\. ?B\.)\s*/i, '').trim(); }

    // 빈 칸은 미리보기에서만 예시 값으로 채운다. 발행 데이터에는 들어가지 않는다.
    function previewCard() {
      const c = JSON.parse(JSON.stringify(collect()));
      if (!c.name) c.name = sample('fName');
      if (!c.role) c.role = sample('fRole');
      if (!c.company) { c.company = sample('fCompany'); c.companyWatermark = c.company; }
      if (!c.slogan) c.slogan = sample('fSlogan');
      if (!c.phone) c.phone = sample('fPhone');
      if (!c.email) c.email = sample('fEmail');
      if (!c.primaryAction) c.primaryAction = { url: '#', label: t('common.website'), icon: 'globe' };
      if (!c.moatTags.length) c.moatTags = sample('fTags').split(',').map((s) => s.trim()).filter(Boolean).slice(0, 3);
      return c;
    }

    let renderTimer = null, renderSeq = 0, renderedWaiters = [];
    function render(immediate) {
      clearTimeout(renderTimer);
      const send = () => {
        const frame = $('preview');
        renderSeq += 1;
        if (frame && frame.contentWindow) frame.contentWindow.postMessage({ action: 'render', card: previewCard(), seq: renderSeq }, '*');
      };
      if (immediate) send(); else renderTimer = setTimeout(send, 80);
    }
    // 뷰어가 다 그렸다는 신호를 기다린다 (너무 오래 걸리면 그냥 진행)
    function waitRendered(ms) {
      return new Promise((resolve) => { renderedWaiters.push(resolve); setTimeout(resolve, ms); });
    }
    function flip(action) { const f = $('preview'); if (f && f.contentWindow) f.contentWindow.postMessage({ action }, '*'); }

    /* ── 배경 ───────────────────────────────────────── */
    let currentBgId = 'toomcard';
    function thumbStyle(bg) {
      if (bg.type === 'image') return `background-image:url('${bg.src}')`;
      if (bg.type === 'gradient') return `background:linear-gradient(${bg.angle}deg, ${bg.from}, ${bg.to})`;
      return `background:${bg.color}`;
    }
    function renderBgGrid() {
      const grid = $('bgGrid');
      grid.querySelectorAll('.bg-thumb:not(.upload)').forEach((n) => n.remove());
      CURATED_BG.forEach((bg) => {
        const d = document.createElement('div');
        d.className = 'bg-thumb'; d.setAttribute('style', thumbStyle(bg)); d.dataset.id = bg.id;
        d.setAttribute('aria-pressed', bg.id === currentBgId ? 'true' : 'false');
        if (bg.tag) d.innerHTML = `<span class="tag">${bg.tag}</span>`;
        d.onclick = () => setBg(bg);
        grid.appendChild(d);
      });
      if (currentBgId === 'upload') grid.querySelector('.upload').setAttribute('aria-pressed', 'true');
      else grid.querySelector('.upload').setAttribute('aria-pressed', 'false');
    }
    let textTouched = false;
    function setBg(bg, id) {
      currentBgId = id || bg.id;
      // 사진(브랜드 플레이트 포함)에는 글자를 자동으로 얹지 않는다. 단색·그라데이션만 이름을 기본으로 보여준다.
      if (!textTouched) {
        const layout = bg.type === 'image' ? 'none' : 'bottom-left';
        card.front.text.layout = layout; pressOnly($('textChips'), 'layout', layout);
      }
      card.front.bg = bg.type === 'image' ? { type: 'image', src: bg.src, zoom: 1, x: 50, y: 50, brightness: 1, filter: 'none' }
                    : bg.type === 'gradient' ? { type: 'gradient', from: bg.from, to: bg.to, angle: bg.angle }
                    : { type: 'color', color: bg.color };
      renderBgGrid(); syncAdjustUI(); render();
    }
    function readImage(file, maxW, cb) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          const scale = Math.min(1, maxW / img.width);
          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL('image/jpeg', 0.86));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    $('bgFile').addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      readImage(f, 1440, (dataUrl) => {
        uploadedPhoto = dataUrl;
        setBg({ type: 'image', src: dataUrl }, 'upload');
        designIdx = 0; renderCarousel();
        if (isMobile()) { currentTab = ''; openTab('photo'); }
        toast(t('maker.bg_set'));
      });
      e.target.value = '';
    });
    $('logoFile').addEventListener('change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      readImage(f, 400, (dataUrl) => { card.logo = { src: dataUrl, alt: card.company }; card.avatar = dataUrl; setLogo(true); render(); });
    });

    /* ── 글자 · 마감 · 뒷면 ─────────────────────────── */
    function pressOnly(container, attr, value) {
      container.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset[attr] === value ? 'true' : 'false'));
    }
    $('textChips').addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      textTouched = true;
      card.front.text.layout = b.dataset.layout; pressOnly($('textChips'), 'layout', b.dataset.layout); render();
    });
    function setLogo(on) { card.front.text.showLogo = !!on; $('logoSwitch').setAttribute('aria-checked', on ? 'true' : 'false'); }
    $('logoSwitch').addEventListener('click', () => { setLogo(!card.front.text.showLogo); render(); });
    $('finishChips').addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      card.front.finish = b.dataset.finish; pressOnly($('finishChips'), 'finish', b.dataset.finish); render();
    });
    $('qrSwitch').addEventListener('click', () => {
      const on = card.front.qr !== 'subtle';
      card.front.qr = on ? 'subtle' : 'off'; $('qrSwitch').setAttribute('aria-checked', on ? 'true' : 'false'); render();
    });
    function renderThemeChips() {
      const box = $('themeChips'); box.innerHTML = '';
      THEMES.forEach(([key, label, color]) => {
        const b = document.createElement('button');
        b.className = 'chip'; b.dataset.theme = key;
        b.innerHTML = `<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color};margin-right:6px;vertical-align:-1px;"></span>${label}`;
        b.setAttribute('aria-pressed', card.theme === key ? 'true' : 'false');
        b.onclick = () => { card.theme = key; pressOnly(box, 'theme', key); render(); };
        box.appendChild(b);
      });
    }
    function renderStartChips() {
      const box = $('startChips'); box.innerHTML = '';
      Object.entries(STARTS).forEach(([key, s]) => {
        const b = document.createElement('button');
        b.className = 'chip'; b.textContent = s.label;
        b.onclick = () => applyStart(key);
        box.appendChild(b);
      });
    }
    const START_ALIAS = { 'toomcard-plate': 'toomcard', editorial: 'white-minimal' };
    function applyStart(key) {
      key = START_ALIAS[key] || key;
      const s = STARTS[key]; if (!s) return;
      const bg = CURATED_BG.find((b) => b.id === s.bg); if (bg) setBg(bg);
      if (!textTouched) { card.front.text.layout = s.text; pressOnly($('textChips'), 'layout', s.text); }
      card.front.finish = s.finish; pressOnly($('finishChips'), 'finish', s.finish);
      card.theme = s.theme; renderThemeChips();
      render();
    }

    /* ── 팬 캐러셀 ───────────────────────────────────── */
    let uploadedPhoto = '';
    let designIdx = 0;
    function designs() {
      const list = Object.entries(STARTS).map(([key, s]) => ({ key, label: s.label, bg: CURATED_BG.find((b) => b.id === s.bg) }));
      if (uploadedPhoto) list.unshift({ key: 'photo', label: t('maker.bg_upload'), bg: { type: 'image', src: uploadedPhoto } });
      return list;
    }
    // 카드 썸네일 7장(-3..3)을 한 줄로 두고, 넘길 때 전체가 한 칸씩 움직인다.
    // 가운데(0) 썸네일은 iframe 카드 바로 뒤에 같은 크기로 깔려, 넘기는 동안 카드 역할을 한다.
    const OFFSETS = [-3, -2, -1, 0, 1, 2, 3];
    function cardBox() {
      const r = $('preview').getBoundingClientRect();
      const w = Math.min(330, r.width - 24, (r.height - 24) / 1.6036);
      return { w, h: w * 1.6036 };
    }
    function slotTransform(off) {
      const a = Math.abs(off), sgn = Math.sign(off);
      if (a === 0) return { t: 'translate(-50%, -50%)', o: 1, z: 4 };
      if (a === 1) return { t: `translate(calc(-50% + ${sgn * 70}%), -50%) rotate(${sgn * 9}deg) scale(0.86)`, o: 0.6, z: 3 };
      if (a === 2) return { t: `translate(calc(-50% + ${sgn * 122}%), -48%) rotate(${sgn * 15}deg) scale(0.74)`, o: 0.28, z: 2 };
      return { t: `translate(calc(-50% + ${sgn * 170}%), -46%) rotate(${sgn * 20}deg) scale(0.64)`, o: 0, z: 1 };
    }
    function placeThumb(el, off, extraX) {
      const st = slotTransform(off);
      el.style.transform = extraX ? `translateX(${extraX}px) ${st.t}` : st.t;
      el.style.opacity = st.o; el.style.zIndex = st.z;
    }
    function renderCarousel() {
      const list = designs(); const n = list.length;
      designIdx = ((designIdx % n) + n) % n;
      $('designName').textContent = list[designIdx].label;
      $('designIdxLabel').textContent = `${designIdx + 1} / ${n}`;
      const stack = $('carStack'); const box = cardBox();
      if (stack.children.length !== OFFSETS.length) {
        stack.innerHTML = '';
        OFFSETS.forEach((off) => { const el = document.createElement('div'); el.className = 'car-thumb'; el.dataset.off = off; stack.appendChild(el); });
      }
      [...stack.children].forEach((el) => {
        const off = Number(el.dataset.off);
        const d = list[(designIdx + off + n * 4) % n];
        el.setAttribute('style', d.bg ? thumbStyle(d.bg) : '');
        el.style.width = box.w + 'px'; el.style.height = box.h + 'px';
        placeThumb(el, off);
        el.onclick = off === 0 ? null : () => goDesign(designIdx + off, Math.sign(off));
      });
    }

    let sliding = false;
    async function goDesign(i, dirHint) {
      if (sliding) return;
      const dir = dirHint || (i > designIdx ? 1 : -1);   // 1 = 다음: 오른쪽 카드가 가운데로 들어온다
      const steps = Math.abs(i - designIdx) || 1;
      const ifr = $('preview'); const stack = $('carStack');
      sliding = true;
      // 1) 다음 디자인을 지금 바로 그리기 시작 (카드가 가려져 있는 동안 완성된다)
      applyDesignSilently(i);
      clearTimeout(renderTimer); render(true);
      // 2) 실제 카드는 살짝 감추고, 썸네일 줄 전체가 한 칸(또는 여러 칸) 이동
      ifr.style.transition = 'opacity 0.12s ease'; ifr.style.transform = ''; ifr.style.opacity = '0';
      stack.classList.add('animating');
      [...stack.children].forEach((el) => placeThumb(el, Number(el.dataset.off) - dir * steps));
      await new Promise((r) => setTimeout(r, 340));
      // 3) 줄을 새 위치 기준으로 다시 깔고, 그려진 카드를 위에 띄운다
      stack.classList.remove('animating');
      renderCarousel();
      await waitRendered(80);
      ifr.style.transform = ''; ifr.style.opacity = '1';
      setTimeout(() => { sliding = false; }, 120);
    }
    function applyDesignSilently(i) {
      const list = designs(); const n = list.length;
      designIdx = ((i % n) + n) % n;
      const d = list[designIdx];
      if (d.key === 'photo') setBg(d.bg, 'upload'); else applyStart(d.key);
      $('designName').textContent = d.label;
      $('designIdxLabel').textContent = `${designIdx + 1} / ${n}`;
    }
    function applyDesign(i) { applyDesignSilently(i); renderCarousel(); }

    // 손가락을 따라 카드와 썸네일 줄이 함께 움직인다
    function onDrag(dx) {
      if (sliding) return;
      const ifr = $('preview');
      ifr.style.transition = 'none';
      ifr.style.transform = `translateX(${dx}px) rotate(${dx / 40}deg)`;
      [...$('carStack').children].forEach((el) => { if (el.dataset.off !== '0') placeThumb(el, Number(el.dataset.off), dx * 0.5); });
    }
    function onDragEnd() {
      const ifr = $('preview');
      ifr.style.transition = 'transform 0.3s cubic-bezier(.2,.8,.2,1), opacity 0.12s';
      ifr.style.transform = '';
      const stack = $('carStack'); stack.classList.add('animating');
      [...stack.children].forEach((el) => placeThumb(el, Number(el.dataset.off)));
      setTimeout(() => stack.classList.remove('animating'), 340);
    }
    window.addEventListener('resize', () => { if (!sliding) renderCarousel(); });

    function pickPhoto() { $('bgFile').click(); }

    /* ── 사진 조정 ───────────────────────────────────── */
    function isImageBg() { return card.front.bg && card.front.bg.type === 'image'; }
    function syncAdjustUI() {
      const on = isImageBg();
      $('photoAdjust').hidden = !on; $('photoOff').hidden = on;
      if (!on) return;
      const b = card.front.bg;
      $('adjZoom').value = b.zoom || 1; $('adjX').value = b.x == null ? 50 : b.x; $('adjY').value = b.y == null ? 50 : b.y; $('adjBright').value = b.brightness || 1;
      $('outZoom').textContent = Math.round((b.zoom || 1) * 100) + '%';
      $('outX').textContent = b.x == null ? 50 : b.x; $('outY').textContent = b.y == null ? 50 : b.y;
      $('outBright').textContent = Math.round((b.brightness || 1) * 100) + '%';
      pressOnly($('filterChips'), 'filter', b.filter || 'none');
    }
    [['adjZoom', 'zoom'], ['adjX', 'x'], ['adjY', 'y'], ['adjBright', 'brightness']].forEach(([id, key]) => {
      $(id).addEventListener('input', (e) => { if (!isImageBg()) return; card.front.bg[key] = Number(e.target.value); liveAdjust(); });
    });
    $('filterChips').addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b || !isImageBg()) return;
      card.front.bg.filter = b.dataset.filter; syncAdjustUI(); render();
    });
    // 사진 탭이 열려 있는 동안 뷰어는 스와이프 대신 이동(pan)·확대(pinch)를 보내온다
    let photoMode = false;
    function setPhotoMode(on) {
      photoMode = !!on && isImageBg();
      const f = $('preview'); if (f && f.contentWindow) f.contentWindow.postMessage({ action: 'photo_mode', on: photoMode }, '*');
    }
    function onPan(dx, dy) {
      if (!photoMode || !isImageBg()) return;
      const b = card.front.bg, box = cardBox(), z = b.zoom || 1;
      // 오른쪽으로 끌면 사진도 오른쪽으로: 보이는 기준점(x%)은 반대로 줄어든다
      b.x = Math.max(0, Math.min(100, (b.x == null ? 50 : b.x) - (dx / box.w) * 100 / z * 1.4));
      b.y = Math.max(0, Math.min(100, (b.y == null ? 50 : b.y) - (dy / box.h) * 100 / z * 1.4));
      liveAdjust();
    }
    function onPinch(ratio) {
      if (!photoMode || !isImageBg()) return;
      const b = card.front.bg;
      b.zoom = Math.max(1, Math.min(2.5, (b.zoom || 1) * ratio));
      liveAdjust();
    }
    // 손으로 조정하는 동안은 사진 스타일만 즉시 보내고, 전체 다시 그리기는 손을 뗀 뒤 한 번
    function liveAdjust() {
      const f = $('preview'); if (f && f.contentWindow) f.contentWindow.postMessage({ action: 'adjust', bg: card.front.bg }, '*');
      syncAdjustUI(); render();
    }
    function resetAdjust() {
      if (!isImageBg()) return;
      Object.assign(card.front.bg, { zoom: 1, x: 50, y: 50, brightness: 1, filter: 'none' }); syncAdjustUI(); render();
    }

    /* ── 하단 탭 + 시트 (폰) ─────────────────────────── */
    const TAB_TITLES = { info: 'maker.tab_info', photo: 'maker.sec_photo', text: 'maker.sec_text', finish: 'maker.sec_finish', publish: 'maker.sec_publish' };
    let currentTab = '';
    function isMobile() { return window.matchMedia('(max-width: 980px)').matches; }
    function openTab(name) {
      if (currentTab === name && document.body.classList.contains('sheet-open')) { closeSheet(); return; }
      currentTab = name;
      document.querySelectorAll('.panel .section[data-tab]').forEach((s) => s.classList.toggle('on', s.dataset.tab === name));
      document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('has-on', !!p.querySelector(`.section.on`)));
      document.querySelectorAll('.sheet-title').forEach((el) => { el.textContent = t(TAB_TITLES[name]); });
      document.querySelectorAll('#tabbar button').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false'));
      document.body.classList.add('sheet-open');
      document.querySelectorAll('.panel').forEach((p) => { p.scrollTop = 0; });
      setPhotoMode(name === 'photo');
      setTimeout(renderCarousel, 320);   // 카드가 작아진 크기에 썸네일 맞추기
    }
    function closeSheet() {
      document.body.classList.remove('sheet-open'); currentTab = '';
      setPhotoMode(false);
      setTimeout(renderCarousel, 320);
      document.querySelectorAll('#tabbar button').forEach((b) => b.setAttribute('aria-selected', 'false'));
    }
    $('tabbar').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-tab]'); if (!b) return;
      // 사진 탭: 아직 사진이 없으면 바로 사진 고르기 (탭 동작 안에서 열어야 폰이 허용한다)
      if (b.dataset.tab === 'photo' && !isImageBg()) pickPhoto();
      openTab(b.dataset.tab);
    });

    /* ── 발행 ───────────────────────────────────────── */
    async function publish() {
      const c = collect();
      if (!c.name || !c.company) { toast(t('maker.need_name')); if (isMobile()) openTab('info'); $('fName').focus(); return; }
      const btn = $('btnPublish'); btn.disabled = true;
      const run = async () => {
        toast(t('maker.publishing'));
        const res = await syncPodToCloud(c.slug, { name: c.name, handle: c.role, bio: c.company, theme: c.theme }, { ...c, card: c });
        btn.disabled = false;
        if (res && res.error) { toast(t('maker.publish_fail') + ' ' + res.error); return; }
        publishedUrl = `${location.origin}/${c.slug}`;
        $('resultLink').textContent = publishedUrl; $('resultLink').href = publishedUrl;
        $('resultQr').innerHTML = '';
        try { new QRCode($('resultQr'), { text: publishedUrl, width: 104, height: 104, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
        $('result').classList.add('show');
        if (typeof gtag === 'function') gtag('event', 'card_published', { event_category: 'conversion', card_name: c.slug });
        toast(t('maker.published_title'));
      };
      if (typeof window.requireAuth === 'function') window.requireAuth(run);
      else { btn.disabled = false; toast(t('maker.publish_fail')); }
    }
    function copyLink() { if (!publishedUrl) return; navigator.clipboard.writeText(publishedUrl).then(() => toast(t('maker.link_copied'))); }
    function shareLink() {
      if (!publishedUrl) return;
      if (navigator.share) navigator.share({ title: `${card.name} · ${card.company}`, url: publishedUrl }).catch(() => {});
      else copyLink();
    }
    function exportJson() {
      const blob = new Blob([JSON.stringify(collect(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${card.slug || 'toomcard'}.json`; a.click();
    }

    /* ── 배경화면 저장: 앞면 레이어를 1080×1920 PNG로 ── */
    function saveWallpaper() {
      const c = collect();
      const W = 1080, H = 1920;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      const drawText = () => {
        const tx = c.front.text || {};
        if (tx.layout && tx.layout !== 'none' && c.name) {
          const light = !(c.front.bg.type === 'color' && isLight(c.front.bg.color)) && !(c.front.bg.type === 'gradient' && isLight(c.front.bg.from));
          ctx.fillStyle = light ? '#ffffff' : '#0b0a10';
          ctx.shadowColor = light ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.35)'; ctx.shadowBlur = 24;
          const center = tx.layout === 'center' || tx.layout === 'bottom-center';
          ctx.textAlign = center ? 'center' : 'left';
          const x = center ? W / 2 : 96;
          let y = tx.layout === 'top-left' ? 220 : (tx.layout === 'center' ? H / 2 : H - 330);
          ctx.font = '800 30px Montserrat, sans-serif'; ctx.fillText((c.company || '').toUpperCase().split('').join(' '), x, y - 70);
          ctx.font = '900 84px Montserrat, Pretendard, sans-serif'; ctx.fillText(c.name, x, y);
          ctx.font = '600 38px Pretendard, sans-serif'; ctx.globalAlpha = 0.85; ctx.fillText(c.role || '', x, y + 62); ctx.globalAlpha = 1;
        }
        const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = `${c.slug || 'toomcard'}-wallpaper.png`; a.click();
        toast(t('maker.wallpaper_saved'));
      };
      const bg = c.front.bg;
      if (bg.type === 'image') {
        const img = new Image(); img.crossOrigin = 'anonymous';
        img.onload = () => {
          const zoom = bg.zoom || 1, px = (bg.x == null ? 50 : bg.x) / 100, py = (bg.y == null ? 50 : bg.y) / 100;
          const s = Math.max(W / img.width, H / img.height) * zoom;
          const w = img.width * s, h = img.height * s;
          if ('filter' in ctx && window.TCCore) { const f = TCCore.frontImageStyle(bg).filter; if (f && f !== 'none') ctx.filter = f; }
          ctx.drawImage(img, (W - w) * px, (H - h) * py, w, h);
          ctx.filter = 'none'; drawText();
        };
        img.onerror = () => { ctx.fillStyle = '#101018'; ctx.fillRect(0, 0, W, H); drawText(); };
        img.src = bg.src;
      } else if (bg.type === 'gradient') {
        const g = ctx.createLinearGradient(0, 0, W * 0.4, H); g.addColorStop(0, bg.from); g.addColorStop(1, bg.to);
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); drawText();
      } else { ctx.fillStyle = bg.color || '#101018'; ctx.fillRect(0, 0, W, H); drawText(); }
    }
    function isLight(hex) {
      const h = (hex || '#000').replace('#', ''); const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
      return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) > 150;
    }

    /* ── 편집 모드 (?edit=slug) ─────────────────────── */
    async function loadForEdit(slug) {
      if (typeof loadPodFromCloud !== 'function') return;
      const res = await loadPodFromCloud(slug); if (!res || !res.pod) return;
      const json = res.pod.components_json || {}; const c = json.card || json;
      card = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CARD)), c);
      if (!c.front) card.front = { bg: { type: 'image', src: c.plateCardImage || DEFAULT_CARD.front.bg.src }, text: { layout: 'none', showLogo: false, tone: 'auto' }, finish: 'metal', qr: 'off' };
      $('fName').value = c.name || ''; $('fRole').value = c.role || ''; $('fCompany').value = c.company || '';
      $('fSlogan').value = c.slogan || ''; $('fPhone').value = c.phone || ''; $('fEmail').value = c.email || '';
      $('fWebsite').value = (c.primaryAction && c.primaryAction.url) || '';
      const s0 = (c.socials || []).find((s) => s.url); if (s0) { $('fSocialType').value = s0.type; $('fSocialUrl').value = s0.url; }
      $('fTags').value = (c.moatTags || []).join(', '); $('fSlug').value = slug;
      currentBgId = card.front.bg.type === 'image' && !CURATED_BG.some((b) => b.src === card.front.bg.src) ? 'upload' : (CURATED_BG.find((b) => b.src === card.front.bg.src || (b.type === card.front.bg.type && b.from === card.front.bg.from)) || {}).id || 'toomcard';
      pressOnly($('textChips'), 'layout', card.front.text.layout); setLogo(card.front.text.showLogo);
      pressOnly($('finishChips'), 'finish', card.front.finish); $('qrSwitch').setAttribute('aria-checked', card.front.qr === 'subtle' ? 'true' : 'false');
      if (currentBgId === 'upload') { uploadedPhoto = card.front.bg.src; designIdx = 0; }
      renderBgGrid(); renderThemeChips(); renderCarousel(); syncAdjustUI(); render();
    }

    /* ── 유틸 ───────────────────────────────────────── */
    let toastTimer;
    function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400); }

    /* ── 초기화 ─────────────────────────────────────── */
    // 화면 높이: 폰 브라우저 주소창이 접혔다 펴질 때도 하단 탭과 무대가 맞도록 실제 높이를 쓴다
    function syncAppHeight() { document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px'); }
    syncAppHeight(); window.addEventListener('resize', syncAppHeight);
    renderBgGrid(); renderThemeChips(); renderStartChips(); renderCarousel(); syncAdjustUI();
    (function preloadDesigns() {
      THEMES.forEach(([key]) => { const l = document.createElement('link'); l.rel = 'preload'; l.as = 'style'; l.href = `/themes/${key}.css`; document.head.appendChild(l); });
      CURATED_BG.filter((b) => b.type === 'image').forEach((b) => { const img = new Image(); img.src = b.src; });
    })();
    document.querySelectorAll('.panel-left .input, .panel-left .select, #fSlug').forEach((el) => el.addEventListener('input', render));
    document.addEventListener('i18n:change', () => { renderThemeChips(); renderCarousel(); if (currentTab) document.querySelectorAll('.sheet-title').forEach((el) => { el.textContent = t(TAB_TITLES[currentTab]); }); render(); });
    // 뷰어가 초기 렌더를 끝내면 card_ready를 보낸다. 그 뒤에 그려야 덮어써지지 않는다.
    window.addEventListener('message', (e) => {
      if (e.data && e.data.action === 'swipe') { const d = e.data.dir === 'next' ? 1 : -1; goDesign(designIdx + d, d); return; }
      if (e.data && e.data.action === 'pan') { onPan(e.data.dx, e.data.dy); return; }
      if (e.data && e.data.action === 'pinch') { onPinch(e.data.ratio); return; }
      if (e.data && e.data.action === 'drag') { onDrag(e.data.dx); return; }
      if (e.data && e.data.action === 'drag_end') { onDragEnd(); return; }
      if (e.data && e.data.action === 'rendered') { const w = renderedWaiters; renderedWaiters = []; w.forEach((fn) => fn()); return; }
      if (!e.data || e.data.action !== 'card_ready') return;
      renderCarousel();
      const params = new URLSearchParams(location.search);
      const edit = params.get('edit');
      const preset = params.get('preset') || params.get('template') || params.get('design');
      if (edit) loadForEdit(edit);
      else if (preset && STARTS[START_ALIAS[preset] || preset]) { designIdx = Object.keys(STARTS).indexOf(START_ALIAS[preset] || preset); applyStart(preset); renderCarousel(); }
      else render();
    });
    lucide.createIcons();
  </script>
</body>
</html>
