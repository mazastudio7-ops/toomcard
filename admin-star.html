<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>TOOMCARD | 스타 검토</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #07050d; color: #fff; font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(7,5,13,.92); border-bottom: 1px solid rgba(255,255,255,.08); }
    .logo { font: 900 16px 'Montserrat', sans-serif; } .logo small { color: #ffd978; margin-left: 8px; font: 800 11px 'Montserrat', sans-serif; letter-spacing: .1em; }
    .auth { appearance: none; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #fff; font-weight: 700; font-size: 12px; padding: 7px 11px; border-radius: 99px; cursor: pointer; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 18px 16px 80px; display: flex; flex-direction: column; gap: 14px; }
    .msg { text-align: center; color: rgba(255,255,255,.6); padding: 40px 0; line-height: 1.6; }
    .item { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 14px; border-radius: 18px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.1); }
    .item.flag { border-color: rgba(255,120,120,.45); }
    .th { width: 96px; height: 154px; border-radius: 12px; background-size: cover; background-position: center; background-color: #1a1626; }
    .nm { font-size: 17px; font-weight: 900; } .ro { font-size: 13px; color: rgba(255,255,255,.6); margin-top: 2px; }
    .meta { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tg { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); }
    .tg.red { background: rgba(255,80,80,.2); color: #ff9c9c; }
    .links { margin-top: 8px; font-size: 12px; color: rgba(255,255,255,.55); word-break: break-all; line-height: 1.5; }
    .acts { display: flex; gap: 8px; margin-top: 12px; }
    .acts button { flex: 1; appearance: none; border: 0; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 14px; cursor: pointer; }
    .ok { background: #ffd978; color: #000; } .no { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.16) !important; }
    .view { display: inline-block; margin-top: 8px; font-size: 12.5px; color: #ffd978; }
  </style>
</head>
<body>
  <header class="bar"><a href="/dashboard" class="logo">TOOMCARD<small>STAR REVIEW</small></a><button class="auth" id="authBtn" type="button">로그인</button></header>
  <main class="wrap" id="list"><div class="msg">불러오는 중…</div></main>
  <script>
    const $ = (id) => document.getElementById(id);
    const FLAG = { words: '금지어', links: '의심 링크', http: 'http 링크', noname: '이름 없음', nophoto: '사진 없음', daily: '하루 3장 초과', reported: '신고 3건+' };
    const TAG = { student: '학생', creator: '크리에이터', biz: '사업', music: '음악', design: '디자인', etc: '기타' };
    let user = null;
    function cardLinks(c) {
      const out = [];
      if (c.primaryAction && c.primaryAction.url) out.push(c.primaryAction.url);
      (c.socials || []).forEach((s) => s && s.url && out.push(s.url));
      (c.links || []).forEach((l) => l && l.url && out.push(l.url));
      return out;
    }
    async function load() {
      const rows = await adminStarQueue();
      if (rows === null) { $('list').innerHTML = '<div class="msg">관리자 계정이 아니에요.<br>SQL Editor에서 tc_admins 에 등록한 계정으로 로그인해 주세요.</div>'; return; }
      if (!rows.length) { $('list').innerHTML = '<div class="msg">검토할 카드가 없어요. 🎉</div>'; return; }
      $('list').innerHTML = rows.map((r) => {
        const c = r.card || {}, bg = (c.front && c.front.bg) || {};
        const th = bg.type === 'image' && bg.src ? `background-image:url('${bg.src.replace(/'/g, '')}')` : (bg.type === 'color' ? `background:${bg.color || '#3b1a6e'}` : '');
        const flags = (r.flags || []).map((f) => `<span class="tg red">${FLAG[f] || f}</span>`).join('');
        const rep = Number(r.reports) > 0 ? `<span class="tg red">신고 ${r.reports}</span>` : '';
        return `<div class="item ${(r.flags || []).length || Number(r.reports) ? 'flag' : ''}" data-slug="${r.slug}">
          <div class="th" style="${th}"></div>
          <div>
            <div class="nm">${esc(c.name || r.slug)}</div><div class="ro">${esc([c.role, c.company].filter(Boolean).join(' · '))}</div>
            <div class="meta"><span class="tg">${TAG[(c.star || {}).tag] || '-'}</span>${flags}${rep}<span class="tg">${new Date(r.submitted_at).toLocaleDateString()}</span></div>
            <div class="links">${cardLinks(c).map(esc).join('<br>') || '<i>링크 없음</i>'}</div>
            <a class="view" href="/${encodeURIComponent(r.slug)}" target="_blank">카드 열어보기 →</a>
            <div class="acts"><button class="ok" data-d="approved">승인</button><button class="no" data-d="rejected">거절</button></div>
          </div></div>`;
      }).join('');
    }
    function esc(s) { return String(s || '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
    $('list').addEventListener('click', async (e) => {
      const b = e.target.closest('button[data-d]'); if (!b) return;
      const item = b.closest('.item'), slug = item.dataset.slug, d = b.dataset.d;
      let reason = null;
      if (d === 'rejected') { reason = prompt('거절 이유 (사용자에게 보여요)', '사진이나 내용을 바꿔 다시 올려 주세요.'); if (reason === null) return; }
      item.style.opacity = '.4';
      const ok = await adminStarDecide(slug, d, reason);
      if (ok) item.remove(); else { item.style.opacity = ''; alert('처리하지 못했어요'); }
      if (!$('list').children.length) load();
    });
    async function init() {
      user = await getCurrentUser();
      $('authBtn').textContent = user ? '로그아웃' : '로그인';
      $('authBtn').onclick = () => (user ? signOutUser() : signInWithGoogle());
      if (!user) { $('list').innerHTML = '<div class="msg">관리자 계정으로 로그인해 주세요.</div>'; return; }
      load();
    }
    if (supabaseClient && supabaseClient.auth) supabaseClient.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_IN' && s && !user) init(); });
    init();
  </script>
</body>
</html>
