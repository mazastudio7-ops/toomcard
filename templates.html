  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #07050d; color: #fff; font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    .bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: rgba(7,5,13,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .logo { font: 900 18px 'Montserrat', sans-serif; letter-spacing: .02em; white-space: nowrap; }
    .cta { background: #ffd978; color: #000; font-weight: 800; font-size: 13px; padding: 9px 14px; border-radius: 99px; white-space: nowrap; }
    .hero { text-align: center; padding: 38px 20px 22px; }
    .hero h1 { font-size: clamp(24px, 6vw, 38px); font-weight: 900; letter-spacing: -0.02em; }
    .hero p { margin-top: 10px; color: rgba(255,255,255,0.6); font-size: 15px; }
    .grid { columns: 2; column-gap: 12px; max-width: 980px; margin: 0 auto; padding: 8px 14px 60px; }
    @media (min-width: 760px) { .grid { columns: 4; column-gap: 16px; } }
    .tile { position: relative; display: block; width: 100%; aspect-ratio: 330 / 529; margin-bottom: 12px; border-radius: 22px; overflow: hidden; background-size: cover; background-position: center; break-inside: avoid; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 14px 34px rgba(0,0,0,0.5); transition: transform .2s ease; }
    .tile:nth-child(3n+2) { aspect-ratio: 330 / 590; }
    @media (hover: hover) { .tile:hover { transform: translateY(-4px); } }
    .ini { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font: 900 96px/1 'Montserrat', sans-serif; background: linear-gradient(180deg,#fff6d6,#d9b25f 55%,#8a6a2a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45)); }
    .tile.light .ini { background: linear-gradient(180deg,#5a4a2c,#2b2418); -webkit-background-clip: text; background-clip: text; }
    .nm { position: absolute; left: 14px; right: 14px; bottom: 16px; font-weight: 900; font-size: 17px; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
    .tile.light .nm { color: #2b2418; text-shadow: none; }
    .go { position: absolute; right: 12px; top: 12px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25); }
    .foot { text-align: center; padding: 0 20px 70px; }
    .foot a { display: inline-block; background: #ffd978; color: #000; font-weight: 900; padding: 15px 30px; border-radius: 99px; font-size: 16px; }
