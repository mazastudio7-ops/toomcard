<!DOCTYPE html>

  <style>
    :root { --bg: #07050d; --card: rgba(255,255,255,.05); --line: rgba(255,255,255,.1); --gold: #ffd978; --tx: #fff; --mut: rgba(255,255,255,.6); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Noto Sans KR', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 0 calc(96px + env(safe-area-inset-bottom)); }
    .hero { position: relative; height: 46vh; min-height: 280px; max-height: 420px; overflow: hidden; background: #111; }
    .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,5,13,.1) 30%, var(--bg) 100%); }
    .hero .back { position: absolute; z-index: 2; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; padding: 8px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 800; color: var(--gold); background: rgba(8,6,14,.72); border: 1px solid rgba(255,217,120,.5); text-decoration: none; backdrop-filter: blur(8px); }
    .head { position: relative; z-index: 2; margin-top: -64px; padding: 0 20px; display: flex; align-items: flex-end; gap: 14px; }
    .head .lg.ini { display: grid; place-items: center; font: 900 26px 'Noto Sans KR', sans-serif; color: #1a1205; background: linear-gradient(135deg, #fff3c4, #ffd978 45%, #b8862a); }
    .head .lg { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; background: #1a1430; border: 2px solid rgba(255,217,120,.6); flex: none; }
    .head h1 { margin: 0; font-size: 22px; font-weight: 900; line-height: 1.2; }
    .head .sub { color: var(--mut); font-size: 13.5px; margin-top: 3px; }
    .swrow { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 20px 0; }
    .swrow:empty { display: none; }
    .swrow a { font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: 99px; text-decoration: none; color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); }
    .tree { display: flex; align-items: center; gap: 12px; margin: 12px 20px 0; padding: 10px 14px 10px 8px; border-radius: 16px; background: linear-gradient(135deg, rgba(124,207,106,.10), rgba(255,217,120,.06)); border: 1px solid rgba(124,207,106,.22); }
    .tree .tv { width: 76px; height: 76px; flex: none; } .tree .tv svg { width: 100%; height: 100%; display: block; }
    .tree .ti { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .tree .th { display: flex; align-items: baseline; gap: 8px; } .tree .th b { font: 900 22px 'Montserrat', sans-serif; color: #9fe08f; } .tree .th span { font-size: 12.5px; font-weight: 800; color: rgba(255,255,255,.75); }
    .tree small { font-size: 12px; color: rgba(255,255,255,.6); } .tree small b { color: #ffd978; }
    .tree .tb { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; } .tree a.fw { text-decoration: none; border-color: rgba(124,207,106,.5); color: #9fe08f; }
    .fw { appearance: none; margin-left: 4px; padding: 3px 10px; border-radius: 99px; border: 1px solid rgba(255,217,120,.5); background: transparent; color: #ffd978; font: 800 11px 'Noto Sans KR', sans-serif; cursor: pointer; }
    .fw.on { background: #ffd978; color: #1a1205; }
    .gbform { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
    .gbform input, .gbform textarea { width: 100%; padding: 10px; border-radius: 10px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: #fff; font: 14px 'Noto Sans KR', sans-serif; outline: 0; resize: vertical; }
    .gbform button { align-self: flex-end; appearance: none; border: 0; padding: 9px 18px; border-radius: 99px; background: var(--gold); color: #1a1205; font: 900 13px 'Noto Sans KR', sans-serif; cursor: pointer; }
    .gbi { padding: 11px 14px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--line); margin-top: 8px; }
    .gbi .h { display: flex; justify-content: space-between; font-size: 12px; color: var(--gold); font-weight: 800; } .gbi .h small { color: var(--mut); font-weight: 400; }
    .gbi p { margin: 4px 0 0; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px 0; }
    .chip { font-size: 12px; font-weight: 700; padding: 5px 11px; border-radius: 99px; background: rgba(255,217,120,.1); color: var(--gold); border: 1px solid rgba(255,217,120,.3); }
    section { padding: 22px 20px 0; }
    h2 { margin: 0 0 10px; font-size: 15px; font-weight: 900; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
    h2::before { content: ''; width: 4px; height: 16px; border-radius: 2px; background: var(--gold); }
    .intro { white-space: pre-wrap; line-height: 1.75; font-size: 15px; color: rgba(255,255,255,.9); }
    .gal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .gal img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; display: block; cursor: zoom-in; background: #151128; }
    .gal img:first-child { grid-column: span 3; aspect-ratio: 16/10; }
    .blk { padding: 18px 20px 0; }
    .blk h2.ct { margin: 6px 0 2px; }
    .blk p.tx { margin: 0; white-space: pre-wrap; line-height: 1.7; font-size: 14.5px; color: rgba(255,255,255,.88); }
    .lk { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: #fff; margin-top: 8px; }
    .lk .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,217,120,.12); font-size: 18px; flex: none; }
    .lk .tt { flex: 1; min-width: 0; } .lk b { display: block; font-size: 14.5px; } .lk small { display: block; color: var(--mut); font-size: 12px; margin-top: 2px; }
    .lk .ar { color: var(--mut); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .gi { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: #fff; font-size: 13px; font-weight: 700; text-align: center; }
    .gi .ic { font-size: 22px; }
    .yt { position: relative; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; background: #000; margin-top: 8px; }
    .yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .pd { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-decoration: none; color: #fff; margin-top: 8px; }
    .pd img, .pd-ph { width: 84px; height: 84px; border-radius: 12px; object-fit: cover; background: #fff; flex: none; display: grid; place-items: center; font-size: 30px; }
    .pd-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .pd-t b { font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pd-t em { font-style: normal; font: 900 16px 'Montserrat', 'Noto Sans KR', sans-serif; color: var(--gold); }
    .pd-t small { color: var(--mut); font-size: 11.5px; }
    .disc { margin: 6px 2px 0; font-size: 10.5px; color: rgba(255,255,255,.4); line-height: 1.4; }
    .items { display: flex; flex-direction: column; gap: 8px; }
    .item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
    .item .nm { flex: 1; min-width: 0; font-weight: 700; }
    .item .nm small { display: block; color: var(--mut); font-weight: 400; font-size: 12.5px; margin-top: 2px; }
    .item .pr { font: 900 15px 'Montserrat', 'Noto Sans KR', sans-serif; color: var(--gold); white-space: nowrap; }
    .news { display: flex; flex-direction: column; gap: 10px; }
    .nw { padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); }
    .nw .d { font-size: 11.5px; color: var(--mut); } .nw b { display: block; margin: 2px 0 4px; } .nw p { margin: 0; white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
    .loc { padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .loc .row { display: flex; gap: 10px; align-items: flex-start; } .loc .row span:first-child { flex: none; width: 20px; text-align: center; }
    .mapbtn { display: inline-block; margin-top: 4px; padding: 10px 16px; border-radius: 99px; font-weight: 800; font-size: 13px; text-decoration: none; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); }
    .rv { padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin-bottom: 8px; }
    .rv .who { font-size: 12.5px; color: var(--gold); font-weight: 800; margin-bottom: 4px; } .rv p { margin: 0; line-height: 1.6; font-size: 14px; }
    .socials { display: flex; flex-wrap: wrap; gap: 8px; }
    .socials a { padding: 9px 14px; border-radius: 99px; font-size: 13px; font-weight: 700; text-decoration: none; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); }
    .cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(7,5,13,0), rgba(7,5,13,.96) 40%); display: flex; gap: 8px; justify-content: center; }
    .cta a, .cta button { flex: 1; max-width: 300px; appearance: none; border: 0; padding: 14px; border-radius: 99px; font: 900 15px 'Noto Sans KR', sans-serif; text-align: center; text-decoration: none; cursor: pointer; }
    .cta .p { background: var(--gold); color: #1a1205; } .cta .g { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2); }
    .foot { padding: 28px 20px 0; text-align: center; font-size: 12.5px; color: var(--mut); }
    .foot a { color: var(--gold); text-decoration: none; font-weight: 800; }
    /* 문의 창 */

    .ov.on { display: flex; }
    .box { width: 100%; max-width: 480px; max-height: 92dvh; overflow-y: auto; background: #140d24; border-radius: 22px 22px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
    .box h3 { margin: 0 0 2px; font-size: 17px; } .box p { margin: 0 0 6px; font-size: 13px; color: var(--mut); }

    .toast.on { opacity: 1; transform: translateX(-50%); }
    [hidden] { display: none !important; }

  <!--DATA-->
  <div class="wrap" id="app">
    <div class="hero" id="hero"><a class="back" id="backCard" href="#">← 명함 보기</a><img id="heroImg" alt="" hidden></div>
    <div class="head"><img class="lg" id="logo" alt="" hidden><div class="lg ini" id="ini" hidden></div><div><h1 id="title"></h1><div class="sub" id="sub"></div></div></div>
    <div class="tree" id="tree" hidden>
      <div class="tv" id="treeSvg"></div>
      <div class="ti"><div class="th"><b id="treeH">1.0m</b><span id="treeStage"></span></div>
        <small id="treeWater"></small><small id="treeMeta"></small>
        <div class="tb"><button type="button" class="fw" id="fwBtn" hidden></button><a class="fw" id="forestLink" hidden></a></div></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="swrow" id="switchRow"></div>
    <section id="secIntro" hidden><div class="intro" id="intro"></div></section>
    <div id="blocks"></div>
    <section id="secGal" hidden><h2 data-t="gal">사진</h2><div class="gal" id="gal"></div></section>
    <section id="secItems" hidden><h2 data-t="items">상품 · 가격</h2><div class="items" id="items"></div></section>
    <section id="secNews" hidden><h2 data-t="news">소식</h2><div class="news" id="news"></div></section>
    <section id="secLoc" hidden><h2 data-t="loc">찾아오는 길</h2><div class="loc" id="loc"></div></section>
    <section id="secRv" hidden><h2 data-t="rv">후기</h2><div id="rv"></div></section>
    <section id="secGb"><h2 data-t="gb">방명록</h2>
      <div class="gbform"><input id="gbName" maxlength="20" data-tp="gbName" placeholder="이름"><textarea id="gbBody" rows="2" maxlength="300" data-tp="gbBody" placeholder="한 줄 남기기"></textarea><button type="button" id="gbSend" data-t="gbSend">남기기</button></div>
      <div id="gbList"></div>
    </section>
    <section id="secSns" hidden><h2 data-t="sns">SNS · 링크</h2><div class="socials" id="sns"></div></section>
    <div class="foot"><span data-t="made">TOOMCARD로 만든 미니홈</span> · <a href="/maker" data-t="mine">나도 만들기</a></div>
  </div>
  <div class="cta"><button type="button" class="p" id="askBtn" data-t="ask">문의 · 예약하기</button><a class="g" id="callBtn" href="#" data-t="call" hidden>전화</a></div>

  <div class="ov" id="ov">
    <div class="box">
      <h3 data-t="askTitle">문의 · 예약</h3>
      <p data-t="askDesc">남기신 내용은 이 분에게만 전달돼요.</p>
      <label data-t="fName">이름</label><input id="fName" autocomplete="name">
      <label data-t="fPhone">전화번호</label><input id="fPhone" type="tel" autocomplete="tel" placeholder="010-1234-5678">
      <label data-t="fEmail">이메일</label><input id="fEmail" type="email" autocomplete="email">
      <label data-t="fWhen">언제 필요하세요?</label>
      <div class="tchips" id="timing"><button type="button" class="tchip" data-t="tNow" data-v="now">🔥 지금</button><button type="button" class="tchip" data-t="tSoon" data-v="soon">1~3개월 안</button><button type="button" class="tchip" data-t="tBrowse" data-v="browse">그냥 둘러봄</button></div>
      <label data-t="fMemo">문의 내용</label><textarea id="fMemo" rows="3"></textarea>
      <button type="button" class="send" id="sendBtn" data-t="send">보내기</button>
      <button type="button" class="cancel" id="cancelBtn" data-t="cancel">닫기</button>
    </div>
  </div>
  <div class="lb" id="lb"><img id="lbImg" alt=""></div>
  <div class="toast" id="toast"></div>
